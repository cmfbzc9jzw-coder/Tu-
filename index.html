/* ---- core.js ---- */
"use strict";
/* ================= Tiện ích ================= */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const fmt = n => Number(n || 0).toLocaleString("vi-VN");
const f1 = n => Math.round(n * 10) / 10;
function tap(el, fn) {
  if (!el) return;
  el.addEventListener("click", e => { Snd.unlock(); fn(e); });
}
function vib(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 12); } catch (e) { /* bỏ qua */ } }
function mmss(sec) { sec = Math.max(0, Math.floor(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m + ":" + (s < 10 ? "0" : "") + s; }

/* ================= Trạng thái (lưu trên máy) ================= */
const KEY = "daloiam.v1";
function freshState() {
  return {
    v: 1, name: "", look: { robe: "lam", hair: "bui", skin: 0 }, birth: "", sound: true, amb: true,
    created: Date.now(), lastVisit: 0,
    st: { visit: 0, nhang: 0, lay: 0, mo: 0, chuong: 0, dhc: 0, niem: 0, chuoi: 0, thien: 0, den: 0, xam: 0, kinh: {}, doc: {} },
    incense: [], lanterns: [], xamLog: [], days: {}
  };
}
let S = freshState();
let STORE_OK = true;
function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const o = JSON.parse(raw), f = freshState();
      S = Object.assign(f, o);
      S.st = Object.assign(freshState().st, o.st || {});
      S.look = Object.assign(freshState().look, o.look || {});
    }
  } catch (e) { STORE_OK = false; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { STORE_OK = false; }
  if (window.Net) Net.push();
}
let TODAY = Lunar.today();
function dayRec() {
  const k = TODAY.dayKey;
  if (!S.days[k]) S.days[k] = {};
  const keys = Object.keys(S.days).sort();
  while (keys.length > 40) delete S.days[keys.shift()];
  return S.days[k];
}
function addStat(k, n) { S.st[k] = (S.st[k] || 0) + (n == null ? 1 : n); save(); HUD.stats(); }

/* ================= Toast · Modal · Sheet ================= */
function toast(msg, ms) {
  const t = $("#toast");
  t.innerHTML = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), ms || 2800);
}
function modal(opt) {
  return new Promise(res => {
    const m = $("#modal");
    m.innerHTML = '<div class="mBox card"><h3>' + esc(opt.title || "") + '</h3><div class="mBody">' + (opt.html || "") + '</div><div class="mBtns">' +
      (opt.buttons || ["Đóng"]).map((b, i) => '<button class="btn ' + (i === (opt.primary == null ? (opt.buttons || []).length - 1 : opt.primary) ? "primary" : "") + '" data-i="' + i + '">' + esc(b) + "</button>").join("") + "</div></div>";
    m.classList.add("open");
    $$("button[data-i]", m).forEach(b => tap(b, () => { m.classList.remove("open"); res(+b.dataset.i); }));
  });
}
const Sheet = {
  el: null, onClose: null,
  open(html, opt) {
    opt = opt || {};
    this.el = $("#sheet");
    this.el.innerHTML = (opt.noClose ? "" : '<button class="sheetX" aria-label="Đóng">×</button>') + html;
    this.el.className = "sheet card open" + (opt.cls ? " " + opt.cls : "");
    this.onClose = opt.onClose || null;
    const x = $(".sheetX", this.el);
    tap(x, () => this.close());
    document.body.classList.add("sheetOn");
    this.el.scrollTop = 0;
    requestAnimationFrame(() => requestAnimationFrame(() => Main.focus(true)));
    return this.el;
  },
  close(silent) {
    if (!this.el) return;
    this.el.classList.remove("open");
    document.body.classList.remove("sheetOn");
    Main.focus(false);
    const cb = this.onClose; this.onClose = null;
    if (cb && !silent) cb();
  },
  get isOpen() { return this.el && this.el.classList.contains("open"); }
};

/* ================= Điều hướng màn hình / lớp phủ ================= */
const OV = {};
let curOv = null;
function showScreen(id) { $$(".scr").forEach(s => s.classList.toggle("on", s.id === id)); }
function hideToast() { const t = $("#toast"); if (t) t.classList.remove("show"); }
function openOv(id, arg) {
  hideToast();
  if (curOv && curOv !== id) closeOv(curOv);
  Sheet.close(true);
  const o = $("#" + id);
  o.classList.add("open");
  curOv = id;
  document.body.classList.add("ovOn");
  if (OV[id] && OV[id].open) OV[id].open(arg);
}
function closeOv(id) {
  id = id || curOv;
  if (!id) return;
  const o = $("#" + id);
  o.classList.remove("open");
  if (OV[id] && OV[id].close) OV[id].close();
  if (curOv === id) curOv = null;
  document.body.classList.remove("ovOn");
  Main.refresh();
}
function ovHead(title, sub) {
  return '<header class="ovHead"><button class="btn btnIcon back" aria-label="Quay lại">' + ICON.back + '</button>' +
    '<div class="ovTitle"><h2>' + title + "</h2>" + (sub ? '<div class="ovSub">' + sub + "</div>" : "") + "</div>" +
    '<button class="btn btnIcon sndBtn" aria-label="Âm thanh">' + (S.sound ? ICON.sound : ICON.mute) + "</button></header>";
}
function wireHead(root, onBack) {
  tap($(".back", root), () => (onBack ? onBack() : closeOv()));
  tap($(".sndBtn", root), toggleSound);
}
function toggleSound() {
  S.sound = !S.sound; save();
  Snd.setMuted(!S.sound);
  $$(".sndBtn").forEach(b => (b.innerHTML = S.sound ? ICON.sound : ICON.mute));
  toast(S.sound ? "Đã bật âm thanh 🔔" : "Đã tắt âm thanh");
}

const ROBE_ORDER = ["lam", "nau", "xam", "trang", "vang", "hong"];
const HAIR_ORDER = ["bui", "dai", "ngan", "tieu"];
function safeLook(l) {
  l = l && typeof l === "object" ? l : {};
  return {
    robe: ROBE_ORDER.indexOf(l.robe) >= 0 ? l.robe : "lam",
    hair: HAIR_ORDER.indexOf(l.hair) >= 0 ? l.hair : "bui",
    skin: [0, 1, 2].indexOf(l.skin) >= 0 ? l.skin : 0
  };
}
function nameTag(name, y, cls) {
  return '<text class="nameTag ' + (cls || "") + '" x="0" y="' + (y == null ? -74 : y) + '" text-anchor="middle">' + esc(name) + "</text>";
}
function lookEditor(root, look, onChange) {
  const L = Object.assign({}, look);
  root.innerHTML =
    '<div class="leRow"><span class="leLab">Áo tràng</span><div class="chips">' +
    ROBE_ORDER.map(k => '<button class="chip sw" data-robe="' + k + '" title="' + Art.ROBE_NAMES[k] + '"><i style="background:' + Art.ROBES[k][0] + '"></i>' + Art.ROBE_NAMES[k] + "</button>").join("") +
    '</div></div><div class="leRow"><span class="leLab">Tóc</span><div class="chips">' +
    HAIR_ORDER.map(k => '<button class="chip" data-hair="' + k + '">' + Art.HAIR_NAMES[k] + "</button>").join("") +
    '</div></div><div class="leRow"><span class="leLab">Da</span><div class="chips">' +
    Art.SKINS.map((c, i) => '<button class="chip sw" data-skin="' + i + '"><i style="background:' + c + '"></i>' + ["Sáng", "Ngăm", "Nâu"][i] + "</button>").join("") +
    "</div></div>";
  function mark() {
    $$("[data-robe]", root).forEach(b => b.classList.toggle("on", b.dataset.robe === L.robe));
    $$("[data-hair]", root).forEach(b => b.classList.toggle("on", b.dataset.hair === L.hair));
    $$("[data-skin]", root).forEach(b => b.classList.toggle("on", +b.dataset.skin === (L.skin | 0)));
  }
  $$("[data-robe]", root).forEach(b => tap(b, () => { L.robe = b.dataset.robe; mark(); onChange(L); }));
  $$("[data-hair]", root).forEach(b => tap(b, () => { L.hair = b.dataset.hair; mark(); onChange(L); }));
  $$("[data-skin]", root).forEach(b => tap(b, () => { L.skin = +b.dataset.skin; mark(); onChange(L); }));
  mark();
  return L;
}
function avatarBig(look, name) {
  return '<svg viewBox="-34 -96 68 102" class="avBig" aria-hidden="true">' + Art.charFront(look) + (name ? nameTag(name, -86, "front") : "") + "</svg>";
}

/* ================= Trăng theo ngày âm lịch ================= */
function moonK() { return (TODAY.day - 0.5) / 29.53; }
function moonPath(cx, cy, r, k) {
  const c = Math.cos(2 * Math.PI * k), rx = f1(Math.max(0.01, Math.abs(c) * r));
  const top = cx + "," + f1(cy - r), bot = cx + "," + f1(cy + r);
  if (k < 0.5) return "M" + top + " A" + r + "," + r + " 0 0,1 " + bot + " A" + rx + "," + r + " 0 0," + (k < 0.25 ? 0 : 1) + " " + top + " Z";
  return "M" + top + " A" + r + "," + r + " 0 0,0 " + bot + " A" + rx + "," + r + " 0 0," + (k > 0.75 ? 1 : 0) + " " + top + " Z";
}

  '<g id="bowlStick"><path d="M106,90 L120,22" stroke="#2b1d14" stroke-width="7" stroke-linecap="round"/><path d="M106,90 L120,22" stroke="#a8763f" stroke-width="3.6" stroke-linecap="round"/><rect x="114" y="12" width="11" height="15" rx="3.5" fill="#b8352a" stroke="#2b1d14" stroke-width="2" transform="rotate(12 119 19)"/></g></svg>';

function buildScript(kinh, withKhai) {
  const secs = [];
  const extra = withKhai && kinh.id !== "nghithuc";
  if (extra) secs.push(KHAI_KE);
  kinh.doan.forEach(d => secs.push(d));
  if (extra) secs.push(HOI_HUONG);
  const lines = [];
  secs.forEach((d, si) => {
    d.l.forEach(raw => {
      const m = raw.match(/\s*\((\d+) lần\)\s*$/);
      const times = m ? +m[1] : 1, text = m ? raw.slice(0, m.index) : raw;
      for (let r = 0; r < times; r++) lines.push({ si: si, text: text, rep: times > 1 ? (r + 1) + "/" + times : "", lay: !!d.lay, syl: text.split(/\s+/).filter(Boolean) });
    });
  });
  let total = 0;
  lines.forEach((L, i) => {
    const nx = lines[i + 1];
    L.endSec = !nx || nx.si !== L.si;
    L.bell = L.lay || L.endSec || !!L.rep;
    total += L.syl.length;
  });
  return { secs: secs, lines: lines, total: total };
}

  flush() { if (this.unsaved) { S.st.mo += this.unsaved; this.unsaved = 0; } save(); },

    $("#tgBody").innerHTML = '<div class="scrollBody"><p class="pickIntro">Chọn bài để tụng. Mỗi tiếng mõ là một chữ; chuông vang cuối mỗi đoạn, mỗi danh hiệu Phật là một lạy.</p><div class="kList">' +

      }).join("") +
      '<button class="kCard" data-k="niem"><span class="kSpine s9"></span><span class="kInfo"><span class="kName">Niệm Phật · lần chuỗi</span><span class="kHan han">南無阿彌陀佛</span><span class="kMeta">108 hạt mỗi chuỗi' + (S.st.chuoi ? " · đã niệm " + S.st.chuoi + " chuỗi" : "") + '</span></span><span class="kGo">Niệm</span></button>' +
      '</div><label class="tog"><input type="checkbox" id="tgKhai"' + (this.withKhai ? " checked" : "") + '><span>Tụng kèm Khai kinh kệ ở đầu và Hồi hướng ở cuối</span></label></div>';
    $("#tgKhai").addEventListener("change", e => { this.withKhai = e.target.checked; });
    $$(".kCard").forEach(b => tap(b, () => {
      if (b.dataset.k === "niem") Niem.show();
      else this.start(KINH.find(k => k.id === b.dataset.k));
    }));
  },
  start(kinh) {
    this.stop();
    this.view = "tung"; this.kinh = kinh; this.sc = buildScript(kinh, this.withKhai);
    if (window.Net) Net.presence({ act: "tung" });
    this.li = 0; this.si = 0; this.n = 0; this.strikes = 0; this.taps = []; this.done = false; this.tStart = 0; this.pauseBeats = 0;
    $("#tgBody").innerHTML =
      '<div class="tgTop"><div class="tgName">' + esc(kinh.ten) + ' <span class="han">' + kinh.han + "</span></div>" +
      '<div class="tgProg"><i id="tgBar"></i></div><div class="tgMeta"><span id="tgCount"></span><span id="tgRhythm"></span></div></div>' +
      '<div class="tgText kinhText" id="tgText"></div>' +
      '<div class="tgCtl"><button class="bowlBtn" id="tgBowl" aria-label="Thỉnh chuông">' + BOWL_SVG + "</button>" +
      '<button class="moBtn" id="tgMo" aria-label="Gõ mõ">' + Art.moBig() + "</button>" +
      '<div class="tgSide"><button class="btn btnSm" id="tgMode"></button><div class="tempo" id="tgTempo"><button class="tBtn" id="tgSlow" aria-label="Chậm hơn">−</button><span id="tgBpm"></span><button class="tBtn" id="tgFast" aria-label="Nhanh hơn">+</button></div><button class="btn btnSm" id="tgPlay"></button></div></div>';
    this.renderText();
    const moB = $("#tgMo");
    moB.addEventListener("pointerdown", e => { e.preventDefault(); Snd.unlock(); if (this.auto) { this.moAnim(); Snd.mo(0.7); } else this.strike("tap"); });
    tap($("#tgBowl"), () => this.bell(true));
    tap($("#tgMode"), () => { this.auto = !this.auto; if (!this.auto) this.pause(); this.ui(); });
    tap($("#tgPlay"), () => (this.playing ? this.pause() : this.play()));
    tap($("#tgSlow"), () => { this.bpm = clamp(this.bpm - 8, 56, 200); this.ui(); });
    tap($("#tgFast"), () => { this.bpm = clamp(this.bpm + 8, 56, 200); this.ui(); });
    this.ui(); this.prog();
    this.cur().classList.add("cur");
  },
  renderText() {
    let h = "", cs = -1;
    const sc = this.sc;
    if (this.kinh.gioi) h += '<div class="tIntro">' + esc(this.kinh.gioi) + "</div>";
    sc.lines.forEach((L, i) => {
      if (L.si !== cs) { if (cs >= 0) h += "</div>"; cs = L.si; h += '<div class="tSec"><div class="tSecT">' + esc(sc.secs[L.si].tieu) + "</div>"; }
      h += '<p class="tLine' + (L.lay ? " lay" : "") + '" data-l="' + i + '">' + L.syl.map(w => '<span class="sy">' + esc(w) + "</span>").join(" ") + (L.rep ? '<em class="rep">' + L.rep + "</em>" : "") + "</p>";
    });
    h += '</div><div id="tEnd"></div>';
    $("#tgText").innerHTML = h;
    this.lineEls = $$("#tgText .tLine");
  },
  cur() { return this.lineEls[this.li].children[this.si]; },
  ui() {
    $("#tgMode").innerHTML = this.auto ? "Mõ tự động" : "Tự gõ mõ";
    $("#tgTempo").style.display = this.auto ? "" : "none";
    $("#tgPlay").style.display = this.auto ? "" : "none";
    $("#tgPlay").innerHTML = this.playing ? "❚❚ Dừng" : "▶ Tụng";
    $("#tgBpm").textContent = this.bpm + " nhịp";
  },
  play() {
    if (this.done) return;
    this.playing = true; this.ui();
    if (!this.tStart) this.tStart = Date.now();
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.loop(), 250);
  },
  pause() { this.playing = false; clearTimeout(this.timer); if (this.built && $("#tgPlay")) this.ui(); },
  stop() { this.playing = false; clearTimeout(this.timer); },
  loop() {
    if (!this.playing || this.done) return;
    const beat = 60000 / this.bpm;
    if (this.pauseBeats > 0) { this.pauseBeats--; this.timer = setTimeout(() => this.loop(), beat); return; }
    this.strike("auto");
    if (this.playing && !this.done) this.timer = setTimeout(() => this.loop(), beat);
  },
  moAnim() {
    const svg = $("#tgMo .moSvg");
    if (!svg) return;
    svg.classList.remove("hit"); void svg.getBBox(); svg.classList.add("hit");
  },
  bell(byHand) {
    Snd.bowl(392, byHand ? 0.9 : 0.75);
    const b = $("#tgBowl .bowlSvg");
    if (b) { b.classList.remove("hit"); void b.getBBox(); b.classList.add("hit"); }
    if (byHand) { S.st.chuong++; }
  },
  strike(src) {
    if (this.done || this.view !== "tung") return;
    const L = this.sc.lines[this.li];
    if (!L) return;
    if (!this.tStart) this.tStart = Date.now();
    Snd.mo(); this.moAnim(); vib(6);
    this.strikes++; this.unsaved++;
    if (this.unsaved >= 25) this.flush();
    if (src === "tap") this.rhythm();
    const sp = this.cur();
    sp.classList.remove("cur"); sp.classList.add("done");
    this.si++; this.n++;
    if (this.si >= L.syl.length) {
      this.lineEls[this.li].classList.add("done");
      if (L.bell) setTimeout(() => this.bell(false), 160);
      if (L.lay) this.layFx(this.lineEls[this.li]);
      this.pauseBeats = L.endSec ? 2 : L.bell ? 1 : 0;
      this.li++; this.si = 0;
      if (this.li >= this.sc.lines.length) { this.prog(); return this.finish(); }
      this.scrollTo();
    }
    this.cur().classList.add("cur");
    this.prog();
  },
  layFx(el) {
    const t = document.createElement("span");
    t.className = "layFx"; t.textContent = "🙇 lạy";
    el.appendChild(t);
    setTimeout(() => t.remove(), 1400);
  },
  scrollTo() {
    const box = $("#tgText"), el = this.lineEls[this.li];
    if (!box || !el) return;
    box.scrollTo({ top: Math.max(0, el.offsetTop - box.clientHeight * 0.36), behavior: "smooth" });
  },
  prog() {
    $("#tgBar").style.width = (100 * this.n / this.sc.total).toFixed(1) + "%";
    $("#tgCount").textContent = fmt(this.n) + " / " + fmt(this.sc.total) + " chữ";
  },
  rhythm() {
    const now = performance.now();
    if (this.taps.length && now - this.taps[this.taps.length - 1] > 2500) this.taps = [];
    this.taps.push(now);
    if (this.taps.length > 10) this.taps.shift();
    const el = $("#tgRhythm");
    if (this.taps.length < 6) { el.innerHTML = ""; return; }
    const d = [];
    for (let i = 1; i < this.taps.length; i++) d.push(this.taps[i] - this.taps[i - 1]);
    const m = d.reduce((a, b) => a + b, 0) / d.length;
    const sd = Math.sqrt(d.reduce((a, b) => a + (b - m) * (b - m), 0) / d.length);
    const dots = clamp(Math.round(5.4 - (sd / m) * 12), 1, 5);
    el.innerHTML = "Nhịp mõ " + "●".repeat(dots) + '<span class="off">' + "●".repeat(5 - dots) + "</span>";
  },
  finish() {
    this.done = true; this.stop(); this.ui();
    [700, 2500, 4300].forEach(d => setTimeout(() => Snd.bowl(392, 0.9), d));
    const k = this.kinh;
    S.st.kinh[k.id] = (S.st.kinh[k.id] || 0) + 1;
    this.flush();
    if (window.Net) Net.event("kinh");
    const secs = this.tStart ? (Date.now() - this.tStart) / 1000 : 0;
    $("#tEnd").innerHTML = '<div class="endCard card"><h3>Viên mãn 🙏</h3><p>Bạn vừa tụng xong <b>' + esc(k.ten) + "</b>: " + fmt(this.sc.total) + " chữ, " + fmt(this.strikes) + " tiếng mõ" + (secs > 5 ? ", trong " + mmss(secs) : "") + ".</p>" +
      '<p class="hh">Nguyện đem công đức này, hướng về khắp tất cả, đệ tử và chúng sinh, đều trọn thành Phật đạo.</p>' +
      '<div class="shBtns"><button class="btn" id="tgAgain">Tụng lại</button><button class="btn" id="tgOther">Kinh khác</button><button class="btn primary" id="tgHome">Về chánh điện</button></div></div>';
    tap($("#tgAgain"), () => this.start(k));
    tap($("#tgOther"), () => this.pick());
    tap($("#tgHome"), () => closeOv("ovTung"));
    setTimeout(() => { const box = $("#tgText"); box.scrollTo({ top: box.scrollHeight, behavior: "smooth" }); }, 200);
  }
};

function plain(t) { return String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d"); }
function gocOrder(matter, q, so) {
  const G = XAM_GOC[matter], pq = plain(q);

  if (pq) G.forEach((g, i) => {
    const n = g[1].split("|").filter(w => pq.indexOf(plain(w)) >= 0).length;
    if (n > bestN) { bestN = n; best = i; }
  });
  const ord = [best].concat([0, 1, 2].filter(i => i !== best));
  ord.hit = bestN > 0;
  return ord;
}
function giaiHtml(matter, hang, q, so) {

}

const LUCHOP = { 0: 1, 1: 0, 2: 11, 11: 2, 3: 10, 10: 3, 4: 9, 9: 4, 5: 8, 8: 5, 6: 7, 7: 6 };
function tuoiNote(by) {
  by = +by;

  const bc = (by + 8) % 12, yc = (TODAY.year + 8) % 12, nam = TODAY.yearName;

  return "Con tuổi <b>" + tuoi + "</b> (cầm tinh con " + CON[bc] + "). " + rel;

function xamGet(so) { return xamList().find(q => q.so === so); }

/* ================= Chùa online: ai mở trang cũng vào được, thấy nhau (MQTT qua WebSocket) =================
   Máy chủ: broker MQTT công cộng miễn phí. Chỉ gửi tên nhân vật, áo, hoạt động và số đếm; lời nguyện, quẻ xăm giữ trên máy. */
const NET_CFG = { url: "wss://broker.emqx.io:8084/mqtt", room: "dlat-q7k2x9m4" };
/* chùa online: thêm một hàng bồ đoàn cho đông người */
[[70, 612, 1.08], [140, 616, 1.08], [260, 616, 1.08], [330, 612, 1.08]].forEach(s => Art.SEATS.push(s));

function netName(x) {
  return typeof x === "string" ? x.replace(/[\u0000-\u001f\u007f-\u009f​-‏‪-‮⁦-⁩]/g, "").trim().slice(0, 18) : "";
}
function netInt(x, max) { x = Math.floor(+x); return isFinite(x) && x > 0 ? Math.min(x, max) : 0; }
function netParse(s) { if (!s || s.length > 4000) return null; try { const o = JSON.parse(s); return o && typeof o === "object" ? o : null; } catch (e) { return null; } }
function netHash(s) { let h = 7; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
const NET_ACTS = ["", "thien", "le", "tung", "nhang"];
const KIND_OK = ["hong", "vang", "trang", "do"];

const Net = {
  cli: null, ok: false, started: false, cid: "", pid: "", act: "", peers: {}, stats: {}, totals: null,
  lastPush: 0, lastToast: 0, T: null, _pt: 0,
  start() {
    if (this.started) return;
    this.started = true;
    if (typeof mqtt === "undefined" || !window.WebSocket) return;
    try { this.cid = localStorage.getItem("daloiam.cid") || ""; } catch (e) { this.cid = ""; }
    if (!/^[a-z0-9]{10}$/.test(this.cid)) {
      this.cid = Array.from({ length: 10 }, () => "abcdefghijklmnopqrstuvwxyz0123456789"[Math.floor(Math.random() * 36)]).join("");
      try { localStorage.setItem("daloiam.cid", this.cid); } catch (e) { /* bỏ qua */ }
    }
    this.pid = this.cid + Math.random().toString(36).slice(2, 6);
    let url = NET_CFG.url;
    try { const q = new URLSearchParams(location.search).get("broker"); if (q && /^wss?:\/\//.test(q)) url = q; } catch (e) { /* bỏ qua */ }
    const base = "dlat/" + NET_CFG.room + "/";
    // p/s: bản lưu (retained) cho người vào sau; lp/ls: bản gửi ngay cho người đang ở chùa
    this.T = { p: base + "p/", lp: base + "lp/", s: base + "s/", ls: base + "ls/", e: base + "e" };
    try {
      this.cli = mqtt.connect(url, {
        clientId: "dl_" + this.pid, clean: true, keepalive: 30, reconnectPeriod: 5000, connectTimeout: 12000, protocolVersion: 4,
        will: { topic: this.T.p + this.pid, payload: "", qos: 0, retain: true }
      });
    } catch (e) { this.cli = null; return; }
    this.cli.on("connect", () => {
      this.ok = true;
      this.cli.subscribe([this.T.p + "+", this.T.lp + "+", this.T.s + "+", this.T.ls + "+", this.T.e], { qos: 0 });
      this.presence(); this.push(true); this.recount(); this.render();
      if (!this._hi) { this._hi = 1; this.event("vao"); }
    });
    this.cli.on("message", (topic, buf) => { try { this.onMsg(topic, buf); } catch (e) { /* bỏ qua */ } });
    this.cli.on("close", () => { if (this.ok) { this.ok = false; this.render(); } });
    this.cli.on("error", () => { /* tự kết nối lại */ });
    setInterval(() => { if (this.ok) this.presence(); this.prune(); }, 25000);
    window.addEventListener("pagehide", () => this.leave());
  },
  online() { return this.ok; },
  onMsg(topic, buf) {
    const s = buf && buf.length ? String(buf) : "";

    if (pre) {
      const id = topic.slice(pre.length);
      if (id === this.pid) return;
      const o = netParse(s), n = o && netName(o.n), t = o && +o.t;
      if (!o || !n || !(t > 0) || Math.abs(Date.now() - t) > 180000) delete this.peers[id];
      else {
        const l = Array.isArray(o.l) ? o.l : [];
        this.peers[id] = { name: n, look: safeLook({ robe: l[0], hair: l[1], skin: l[2] }), act: NET_ACTS.indexOf(o.a) >= 0 ? o.a : "", t: t, dev: String(id).slice(0, 10) };
      }
      this.render();
    } else if (spre) {
      const id = topic.slice(spre.length);
      if (id === this.cid) return;
      const o = netParse(s);

      else {
        const now = Date.now();
        const ic = (Array.isArray(o.ic) ? o.ic : []).slice(0, 6).filter(x => Array.isArray(x) && now - x[0] < 45 * 60000 && now - x[0] > -300000).map(x => ({ t: +x[0], n: x[1] === 3 ? 3 : 1 }));

        this.stats[id] = { vi: netInt(o.vi, 1e5), h: netInt(o.h, 1e6), d: netInt(o.d, 1e5), ic: ic, dn: dn };
      }
      this.recount();
      Main.renderIncense();
      if (curOv === "ovDen") Den.renderSaved();
    } else if (topic === this.T.e) {
      const o = netParse(s);
      if (o && o.id !== this.pid) this.onEvent(o);
    }
  },
  recount() {
    const t = { visit: S.st.visit, nhang: S.st.nhang, den: S.st.den };
    Object.keys(this.stats).forEach(k => { const x = this.stats[k]; t.visit += x.vi; t.nhang += x.h; t.den += x.d; });
    this.totals = this.ok || Object.keys(this.stats).length ? t : null;
    HUD.stats();
  },
  fresh() {
    const now = Date.now();
    return Object.keys(this.peers).map(k => this.peers[k]).filter(p => Math.abs(now - p.t) < 180000);
  },
  prune() {
    const now = Date.now();
    let ch = false;
    Object.keys(this.peers).forEach(k => { if (Math.abs(now - this.peers[k].t) >= 180000) { delete this.peers[k]; ch = true; } });
    if (ch) this.render();
  },
  peerCount(act) {
    if (!this.ok) return 0;
    const o = this.fresh().filter(p => !act || p.act === act).length;
    return o + (!act || this.act === act ? 1 : 0);
  },
  render() {
    Main.peers = this.fresh().sort((a, b) => a.t - b.t).map(p => ({ name: p.name, look: p.look, pose: p.act === "le" ? "kneel" : "sit" }));
    if ($("#scrMain").classList.contains("on")) Main.renderPeople();
    HUD.pill();
    if (Thien.active) Thien.updatePill();
  },
  presence(patch) {
    if (patch && Object.prototype.hasOwnProperty.call(patch, "act")) this.act = patch.act || "";
    if (!this.ok || !S.name) return;
    const o = { v: 1, n: S.name.slice(0, 18), l: [S.look.robe, S.look.hair, S.look.skin | 0], a: this.act, t: Date.now() };
    const js = JSON.stringify(o);
    try { this.cli.publish(this.T.p + this.pid, js, { qos: 0, retain: true }); this.cli.publish(this.T.lp + this.pid, js, { qos: 0 }); } catch (e) { /* bỏ qua */ }
  },
  push(force) {
    if (!this.ok || !S.name) return;
    const now = Date.now();
    if (!force && now - this.lastPush < 5000) {
      clearTimeout(this._pt);
      this._pt = setTimeout(() => this.push(true), 5000);
      return;
    }
    this.lastPush = now;
    const ic = S.incense.filter(x => now - x.t < 45 * 60000).slice(-6).map(x => [x.t, x.xs.length]);
    const dn = S.lanterns.filter(l => now - l.t < 3 * 86400000).slice(0, 6).map(l => [l.t, l.kind, Math.round(l.x), Math.round(l.y)]);
    const o = { v: 1, vi: S.st.visit, h: S.st.nhang, d: S.st.den, ic: ic, dn: dn };
    const js = JSON.stringify(o);
    try { this.cli.publish(this.T.s + this.cid, js, { qos: 0, retain: true }); this.cli.publish(this.T.ls + this.cid, js, { qos: 0 }); } catch (e) { /* bỏ qua */ }
    this.recount();
  },
  event(k, extra) {
    if (!this.ok || !S.name) return;
    const o = Object.assign({ id: this.pid, n: S.name.slice(0, 18), k: k }, extra || {});
    try { this.cli.publish(this.T.e, JSON.stringify(o), { qos: 0 }); } catch (e) { /* bỏ qua */ }
  },
  onEvent(o) {
    const n = netName(o.n);
    if (!n) return;
    let msg = "";
    if (o.k === "dhc") { msg = n + " vừa thỉnh đại hồng chung 🔔"; if (!Thien.active) Snd.bigBell(0.32); }
    else if (o.k === "nhang") msg = n + " vừa thắp " + (o.c === 3 ? "ba" : "một") + " nén nhang 🙏";
    else if (o.k === "den") msg = n + " vừa thả một ngọn hoa đăng 🪷";
    else if (o.k === "xam") msg = n + " vừa xin một quẻ xăm 📜";
    else if (o.k === "kinh") msg = n + " vừa tụng xong một thời kinh 📿";
    else if (o.k === "vao") msg = n + " vừa bước vào chùa 🙏";
    else return;
    const now = Date.now();
    if (now - this.lastToast > 3500 && !Thien.active) { this.lastToast = now; toast(esc(msg), 3000); }
  },
  otherIncense() {
    const out = [];
    Object.keys(this.stats).forEach(k => this.stats[k].ic.forEach(x => {
      const h = netHash(k + x.t), base = 200 + (h % 31) - 15, offs = x.n === 3 ? [-6, 0, 6] : [0];
      out.push({ t: x.t, xs: offs.map(o => base + o), tilts: offs.map((o, i) => ((h >> (i + 2)) % 5) - 2) });
    }));
    return out.sort((a, b) => a.t - b.t).slice(-8);
  },
  otherLanterns() {
    const out = [];
    Object.keys(this.stats).forEach(k => this.stats[k].dn.forEach(l => out.push(l)));
    return out.sort((a, b) => b.t - a.t).slice(0, 12);
  },
  leave() {
    if (!this.ok) return;
    try { this.cli.publish(this.T.p + this.pid, "", { qos: 0, retain: true }); this.cli.publish(this.T.lp + this.pid, "", { qos: 0 }); this.cli.end(false); } catch (e) { /* bỏ qua */ }
  }
};
window.Net = Net;

;
/* ---- boot.js ---- */
/* ================= Khởi động ================= */
const DOCK = [
  ["nhang", "Thắp nhang", () => Nhang.start()],
  ["le", "Lễ Phật", () => Le.start()],
  ["mo", "Tụng kinh", () => openOv("ovTung")],
  ["beads", "Niệm Phật", () => openOv("ovTung", { niem: 1 })],
  ["kinh", "Tàng kinh", () => openOv("ovKinh")],
  ["xam", "Xin xăm", () => openOv("ovXam")],
  ["den", "Hoa đăng", () => openOv("ovDen")],
  ["thien", "Ngồi thiền", () => Thien.setup()],
  ["chuong", "Thỉnh chuông", () => openOv("ovChuong")],
  ["so", "Công đức", () => openOv("ovSo")]
];
function buildDock() {
  $("#dock").innerHTML = DOCK.map((d, i) => '<button data-i="' + i + '">' + (d[0] === "beads" ? ICON.beads : Art.icon(d[0], 28)) + "<span>" + d[1] + "</span></button>").join("");
  $$("#dock button").forEach(b => tap(b, () => { if (!Thien.active) DOCK[+b.dataset.i][2](); }));
}
function wireHud() {
  $("#hBack").innerHTML = ICON.back;
  tap($("#hBack"), () => { Sheet.close(true); Gate.look = null; Gate.panel(); showScreen("scrGate"); });
  $("#hSnd").innerHTML = S.sound ? ICON.sound : ICON.mute;
  tap($("#hSnd"), toggleSound);
  $("#hName").innerHTML = ICON.pen + " Đổi tên";
  tap($("#hName"), () => CharEd.open());
  $("#hMin").innerHTML = ICON.minus;
  tap($("#hMin"), () => { Sheet.close(true); document.body.classList.add("hudHidden"); });
  $("#hShow").innerHTML = ICON.plus;
  tap($("#hShow"), () => document.body.classList.remove("hudHidden"));
}
function boot(hot) {
  loadState();
  Snd.setMuted(!S.sound);
  Gate.build();
  Main.build();
  buildDock();
  wireHud();
  HUD.stats(); HUD.pill(); HUD.date();
  showScreen("scrGate");
  setInterval(() => Main.applyTime(), 60000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { Main.applyTime(); Main.renderIncense(); if (Thien.active) Thien.tick(); }
  });
  window.addEventListener("pagehide", () => { Tung.flush(); });
  // iOS tạm dừng âm thanh khi rời ứng dụng: chạm lại là mở lại
  document.addEventListener("touchend", () => Snd.unlock(), { passive: true });
  document.body.classList.add("ready");
  // giữ chỗ người chơi khi trang được cập nhật phiên bản mới
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ scr: $("#scrMain").classList.contains("on") ? "main" : "gate" })); } catch (e) { /* bỏ qua */ }
  if (hot && hot.scr === "main" && S.name) Gate.toMain();
}
(function () {
  const h = window.claude && window.claude.hot;
  if (h && typeof h.ready === "function") h.ready(boot);
  else boot((h && h.data) || {});
})();

</script>
