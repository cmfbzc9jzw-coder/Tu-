<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đại Lôi Âm Tự</title>
<meta name="theme-color" content="#2b1d14">
<meta name="description" content="Cùng đi chùa online: thắp nhang, gõ mõ tụng kinh, xin xăm, thả hoa đăng, ngồi thiền.">
<meta property="og:title" content="Đại Lôi Âm Tự · đi chùa online">
<meta property="og:description" content="Thắp nhang, gõ mõ tụng kinh, xin xăm, thả hoa đăng, ngồi thiền cùng bạn bè.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&display=swap&text=%E4%BA%BA%E4%BD%9B%E5%84%80%E5%85%89%E5%85%AB%E5%8D%97%E5%90%8D%E5%92%92%E5%A4%9A%E5%A4%A7%E5%AF%B6%E5%AF%BA%E5%B8%B8%E5%BD%8C%E5%BF%83%E6%82%B2%E6%87%BA%E6%99%AE%E6%B3%95%E6%B3%A2%E6%B4%AA%E7%84%A1%E7%85%A7%E7%B1%A4%E7%B6%93%E7%BE%85%E8%88%AC%E8%8B%A5%E8%9C%9C%E8%A6%BA%E8%A7%80%E8%AA%A6%E8%AA%AA%E8%AA%B2%E8%BC%AA%E8%BD%89%E9%98%BF%E9%99%80%E9%9B%B7%E9%9D%88%E9%9F%B3">
<style>
/* Một thế giới hình vẽ duy nhất: nét mực nâu đậm, giấy kem, son đỏ, vàng đồng; chữ tròn Nunito + Noto Serif cho kinh văn */
:root {
  color-scheme: light;
  --ink: #2b1d14; --cream: #f8f0dc; --cream2: #efe2c0; --paper: #fbf6ea; --red: #b8352a; --red2: #8f1f16;
  --gold: #e9b949; --gold2: #f6d47a; --leaf: #5f8d4e; --muted: #7d6a58;
  --ui: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Noto Serif", "Iowan Old Style", "Times New Roman", serif;
  --han: "LXGW WenKai TC", "Kaiti TC", "Kaiti SC", "STKaiti", "BiauKai", "Songti TC", "Songti SC", "Noto Serif CJK TC", "Noto Serif CJK SC", serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1c140e; }
body { font-family: var(--ui); color: var(--ink); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button { font-family: inherit; color: inherit; touch-action: manipulation; }
:focus-visible { outline: 3px solid #e9b949; outline-offset: 2px; }
.btn:focus-visible, .chip:focus-visible { outline-color: #b8352a; }
input, textarea { font-family: inherit; }
#app { position: fixed; inset: 0; max-width: 540px; margin: 0 auto; overflow: hidden; background: #f3ead2; box-shadow: 0 0 60px rgba(0, 0, 0, .5); }
.han { font-family: var(--han); font-weight: 700; }
.hanI { font-family: var(--han); font-weight: 700; color: var(--red2); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
b { font-weight: 800; }

/* ---------- nút, thẻ, chip ---------- */
.btn { font: 800 15px/1.15 var(--ui); background: var(--cream); border: 2.5px solid var(--ink); border-radius: 15px; padding: 11px 16px; box-shadow: 0 3px 0 var(--ink); cursor: pointer; transition: transform .08s, box-shadow .08s, background .2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; user-select: none; -webkit-user-select: none; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: #f7d97c; }
.btn.danger { background: #f3c9bd; }
.btn.big { font-size: 17px; padding: 14px 20px; border-radius: 18px; }
.btn.wide { width: 100%; }
.btnIcon { width: 44px; height: 44px; padding: 0; border-radius: 14px; flex: none; }
.btnIcon.sm { width: 38px; height: 38px; border-radius: 12px; }
.btnSm { padding: 8px 12px; font-size: 14px; border-radius: 13px; }
.lnk { border: 0; background: none; padding: 0; font: inherit; font-weight: 800; color: var(--red2); text-decoration: underline; cursor: pointer; }
.card { background: var(--paper); border: 2.5px solid var(--ink); border-radius: 20px; box-shadow: 0 4px 0 rgba(43, 29, 20, .85); }
.pill { background: rgba(250, 244, 226, .94); border: 2.5px solid var(--ink); border-radius: 999px; padding: 8px 16px; font-weight: 800; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #3fa34d; box-shadow: 0 0 0 2px rgba(63, 163, 77, .25); display: inline-block; animation: pulse 2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(63, 163, 77, .08); } }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { font: 800 14px/1 var(--ui); padding: 9px 12px; border: 2px solid var(--ink); border-radius: 999px; background: #fff9ea; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: #f7d97c; box-shadow: 0 2px 0 var(--ink); }
.chip.sw i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--ink); display: inline-block; }
.seg { display: inline-flex; border: 2.5px solid var(--ink); border-radius: 14px; overflow: hidden; background: #fff9ea; }
.seg button { border: 0; background: none; padding: 9px 12px; font: 800 14px var(--ui); cursor: pointer; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button.on { background: #f7d97c; }
.tBtn { width: 36px; height: 34px; border: 2px solid var(--ink); border-radius: 10px; background: #fff9ea; font: 900 16px var(--ui); cursor: pointer; }
.inp { display: block; width: 100%; margin-top: 5px; font: 700 16px var(--ui); padding: 11px 12px; border: 2.5px solid var(--ink); border-radius: 13px; background: #fffdf6; color: var(--ink); outline: none; resize: none; }
.inp:focus { background: #fff; box-shadow: 0 0 0 3px rgba(233, 185, 73, .5); }
.fLab { display: block; font-weight: 800; font-size: 14px; margin: 10px 0 6px; }
.fLab small, .shT small { font-weight: 700; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px; }
.tog { display: flex; gap: 10px; align-items: flex-start; font-weight: 700; font-size: 14px; margin: 10px 0; cursor: pointer; }
.tog input { width: 20px; height: 20px; accent-color: #b8352a; flex: none; margin-top: 1px; }
.tip { font-size: 13.5px; line-height: 1.45; background: #fff4d2; border: 2px dashed #d9b25d; border-radius: 12px; padding: 9px 11px; margin: 10px 0; }
.shBtns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.shBtns .btn { flex: 1 1 auto; }

/* ---------- màn hình ---------- */
.scr { position: absolute; inset: 0; display: none; }
.scr.on { display: flex; }
.scr.fadeOut { animation: fadeOut .35s forwards; }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; } }

/* cổng tam quan */
#scrGate { flex-direction: column; background: linear-gradient(#8fcbe9, #f3eedb 60%); }
.gateHead { text-align: center; padding: calc(14px + var(--sat)) 12px 0; position: relative; z-index: 2; }
.gateHan { font-size: 22px; color: var(--red2); letter-spacing: 6px; }
.gateHead h1 { margin: 0; font: 900 34px/1.05 var(--ui); letter-spacing: .5px; color: var(--ink); text-shadow: 0 2px 0 #fff6d6; }
.gateSub { font-weight: 800; font-size: 13.5px; color: #5d4a3a; margin-top: 3px; }
.gateArt { flex: 1 1 auto; min-height: 150px; position: relative; }
.gateArt svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.door { cursor: pointer; }
.gatePanel { position: relative; z-index: 3; margin: 0 10px calc(10px + var(--sab)); padding: 14px 14px 0; max-height: 62%; overflow: auto; flex: none; animation: rise .5s ease; }
.gatePanel > :last-child:not(.gateGo) { margin-bottom: 14px; }
.gateGo { position: sticky; bottom: 0; margin: 12px -14px 0; padding: 10px 14px 14px; background: linear-gradient(rgba(251, 246, 234, 0), #fbf6ea 30%); }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }
.gpT { margin: 0 0 6px; font: 900 19px var(--ui); }
.gpBack { display: flex; gap: 12px; align-items: center; }
.spDay { font-weight: 800; color: var(--red2); margin: 4px 0 0; font-size: 14px; }
.ceTop { display: flex; gap: 12px; align-items: flex-start; }
.cePrev { flex: none; width: 92px; height: 132px; background: radial-gradient(circle at 50% 70%, #fff3cc, #f3e3b8 70%); border: 2.5px solid var(--ink); border-radius: 18px; display: grid; place-items: center; overflow: hidden; }
.cePrev.small { width: 70px; height: 100px; }
.avBig { width: 100%; height: 100%; }
.ceForm { flex: 1; min-width: 0; }
.ceForm .fLab:first-child { margin-top: 0; }
.leRow { margin-top: 10px; }
.leLab { display: block; font-weight: 800; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
.leRow .chip { padding: 7px 10px; font-size: 13px; }

/* chánh điện */
#scrMain { flex-direction: column; }
.sceneWrap { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: #e8dcc0; }
.sceneArt { position: absolute; inset: 0; transition: transform .45s cubic-bezier(.3, .8, .3, 1); will-change: transform; }
body.sheetOn .hud, body.sheetOn .hudDate { opacity: 0; pointer-events: none; }
.sceneArt svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
.hot { cursor: pointer; }
.hud { position: absolute; top: 0; left: 0; right: 0; padding: calc(8px + var(--sat)) 10px 0; z-index: 10; pointer-events: none; transition: opacity .3s, transform .3s; }
.hud > * { pointer-events: auto; }
.hudRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hudRow .pill { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.hudRow2 { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 8px; gap: 8px; pointer-events: none; }
.hudRow2 > * { pointer-events: auto; }
.hudLeft { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.hudStats { background: rgba(250, 244, 226, .9); border: 2.5px solid var(--ink); border-radius: 16px; padding: 7px 11px; font-size: 12.5px; font-weight: 700; line-height: 1.4; text-align: right; }
.hudStats b { font-weight: 900; }
.hudDate { position: absolute; left: 0; right: 0; bottom: 6px; z-index: 8; text-align: center; font-size: 12px; font-weight: 800; color: #3b2a1f; pointer-events: none; text-shadow: 0 1px 0 rgba(255, 255, 255, .8); padding: 0 8px; }
body.zen .hudDate { opacity: 0; }
.hudDate .sp { display: block; color: var(--red2); }
body[data-time="night"] .hudDate, body[data-time="dusk"] .hudDate { color: #fff3d6; text-shadow: 0 1px 2px rgba(0, 0, 0, .7); }
body[data-time="night"] .hudDate .sp { color: #ffd27a; }
.showHud { position: absolute; top: calc(8px + var(--sat)); right: 10px; z-index: 11; display: none; opacity: .85; }
body.hudHidden .hud, body.hudHidden .dock { display: none; }
body.hudHidden .showHud { display: inline-flex; }
.dock { position: relative; z-index: 12; flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; padding: 8px 8px calc(8px + var(--sab)); background: linear-gradient(#f0e2bd, #e5d1a3); border-top: 3px solid var(--ink); transition: transform .3s; }
.dock button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 5px 2px 6px; min-height: 58px; border: 2px solid var(--ink); border-radius: 14px; background: var(--cream); box-shadow: 0 2px 0 var(--ink); font: 800 11.5px/1.1 var(--ui); cursor: pointer; }
.dock button:active { transform: translateY(2px); box-shadow: none; }
.dock button span { text-align: center; line-height: 1.05; overflow-wrap: anywhere; }
@media (max-width: 389px) { .dock { gap: 5px; padding-left: 6px; padding-right: 6px; } .dock button { font-size: 10.5px; padding-left: 1px; padding-right: 1px; } }
body.zen .hud, body.zen .dock { opacity: 0; pointer-events: none; }
body.zen .dock { transform: translateY(100%); }
body.zen #scrMain { background: #8d8a89; }

/* chữ, hiệu ứng trong cảnh */
.nameTag { font: 900 13px var(--ui); fill: #b8352a; stroke: #fffaf0; stroke-width: 3.6px; paint-order: stroke; stroke-linejoin: round; }
.nameTag.peer { fill: #2f6fb0; }
.nameTag.front { font-size: 12px; }
.floatTxt { font: 900 13px var(--ui); fill: #fff3c4; stroke: #8f1f16; stroke-width: 3px; paint-order: stroke; animation: floatUp 1.2s ease-out forwards; }
@keyframes floatUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-40px); opacity: 0; } }
.ringFx { fill: none; stroke: #ffe08a; stroke-width: 2.5; transform-box: fill-box; transform-origin: center; animation: ringOut 1.4s ease-out forwards; }
@keyframes ringOut { from { transform: scale(1); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
#moHot.hit, #chuongHot.hit { transform-box: fill-box; transform-origin: 50% 100%; animation: knock .22s ease-out; }
@keyframes knock { 40% { transform: scale(.96, .93); } }
.person .pose, #me .pose { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 4.6s ease-in-out infinite; }
.person:nth-child(2n) .pose { animation-duration: 5.3s; }
@keyframes breathe { 50% { transform: scale(1.012, 1.022); } }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick .16s ease-in-out infinite alternate; }
.flame.f2 { animation-duration: .2s; }
@keyframes flick { to { transform: scale(.86, 1.14); } }
.lglow { animation: glow 2.4s ease-in-out infinite alternate; }
.cglow { animation: glow 1.1s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: .6; } to { opacity: 1; } }
.ember { animation: ember 1.3s ease-in-out infinite alternate; }
@keyframes ember { from { opacity: .65; } to { opacity: 1; } }
.smoke { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; animation: smoke 5s linear infinite; }
@keyframes smoke { 0% { opacity: 0; transform: translateY(0) scale(.7, .6); } 15% { opacity: .6; } 70% { opacity: .25; } 100% { opacity: 0; transform: translateY(-40px) scale(1.5, 1.3); } }
.tw0 { animation: tw 3.2s ease-in-out infinite; }
.tw1 { animation: tw 4.4s ease-in-out .8s infinite; }
.tw2 { animation: tw 5.6s ease-in-out 1.7s infinite; }
@keyframes tw { 50% { opacity: .2; } }
.cloud { animation: drift 28s ease-in-out infinite alternate; }
.cloud.c2 { animation-duration: 36s; animation-direction: alternate-reverse; }
.cloud.c3 { animation-duration: 44s; }
@keyframes drift { from { transform: translateX(-26px); } to { transform: translateX(26px); } }
body[data-time="night"] #haloGlow { opacity: .85; }
.tipFire { pointer-events: none; }
.bob { animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-2.5px) rotate(1.5deg); } }
.lgl { animation: glow 1.8s ease-in-out infinite alternate; }
.lfl { transform-box: fill-box; transform-origin: 50% 100%; animation: flick .19s ease-in-out infinite alternate; }
.farLights { animation: glow 3s ease-in-out infinite alternate; }
.ripples { animation: drift 9s ease-in-out infinite alternate; }
.willow { transform-box: fill-box; transform-origin: 50% 0; animation: sway 7s ease-in-out infinite alternate; }
@keyframes sway { from { transform: skewX(-1.5deg); } to { transform: skewX(1.5deg); } }

/* ---------- bottom sheet ---------- */
.sheet { position: absolute; left: 8px; right: 8px; bottom: calc(8px + var(--sab)); z-index: 30; max-height: 74%; overflow: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px 18px; transform: translateY(115%); transition: transform .38s cubic-bezier(.2, .9, .3, 1.08); visibility: hidden; }
.sheet.open { transform: none; visibility: visible; }
.sheet.tall { max-height: 86%; }
.sheetX { position: sticky; top: -6px; float: right; margin: -6px -6px 0 6px; width: 34px; height: 34px; border: 2px solid var(--ink); border-radius: 50%; background: #fff4d8; font: 900 20px/1 var(--ui); cursor: pointer; z-index: 2; }
.shT { margin: 0 0 8px; font: 900 19px/1.25 var(--ui); }
.sheet p { margin: 8px 0; line-height: 1.5; font-size: 15px; }
.steps { display: flex; gap: 4px; margin: 0 40px 10px 0; }
.steps span { flex: 1; text-align: center; font-size: 11.5px; font-weight: 800; padding: 5px 2px; border-radius: 9px; background: #efe5cc; color: #8a7663; border: 1.5px solid transparent; }
.steps span.done { background: #d8e8c8; color: #3d6b2f; }
.steps span.cur { background: #f7d97c; color: var(--ink); border-color: var(--ink); }
.choice2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.choice2 .btn { flex-direction: column; padding: 14px 8px; }
.khan { font-family: var(--serif); font-size: 15.5px; line-height: 1.6; background: #fffaf0; border: 2px solid #e2cf9f; border-radius: 14px; padding: 6px 13px; margin: 8px 0; }
.khan p { margin: 7px 0 !important; font-size: 15.5px !important; }
.bigCount { text-align: center; font: 900 34px var(--ui); margin: 6px 0; }
.leName { text-align: center; font-family: var(--serif); font-weight: 700; font-size: 18px; color: var(--red2); margin-top: 8px; }
.leName small { display: block; font-family: var(--ui); font-size: 13px; color: var(--muted); font-weight: 700; margin-top: 4px; }
.ceTop + #ceLook { margin-top: 2px; }

/* ---------- thiền ---------- */
.zenHud { position: absolute; inset: 0; z-index: 9; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
.zenHud:empty { display: none; }
.zTop { display: flex; justify-content: center; padding-top: calc(10px + var(--sat)); }
.zBreath { position: absolute; left: 0; right: 0; top: 40%; display: grid; place-items: center; }
.zBreath.off { display: none; }
.zCircle { width: 120px; height: 120px; border-radius: 50%; border: 3px solid rgba(255, 246, 214, .9); background: radial-gradient(circle, rgba(255, 238, 180, .38), rgba(255, 238, 180, .05) 70%); box-shadow: 0 0 40px rgba(255, 220, 140, .45); transform: scale(.62); transition: transform 4s ease-in-out; }
.zCircle.in { transform: scale(1); transition-duration: 4s; }
.zCircle.out { transform: scale(.62); transition-duration: 6s; }
.zTxt { position: absolute; font: 900 16px var(--ui); color: #fffaf0; text-shadow: 0 1px 4px rgba(0, 0, 0, .7); }
.zBot { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-bottom: calc(18px + var(--sab)); pointer-events: auto; }
.zTime { font-size: 20px; padding: 6px 18px; }
.zTime small { font-size: 12px; font-weight: 700; color: var(--muted); margin-left: 4px; }
.zUp { min-width: 210px; font-size: 22px; padding: 16px 30px; border-radius: 22px; background: #f7e6ae; }
body.zen #mNight { opacity: .42 !important; transition: opacity 2s; }
body.zen .sceneWrap::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, transparent 45%, rgba(20, 12, 6, .45)); pointer-events: none; }

/* ---------- lớp phủ ---------- */
.ov { position: absolute; inset: 0; z-index: 40; display: none; flex-direction: column; background: #f3ead2; }
.ov.open { display: flex; animation: ovIn .28s ease; }
@keyframes ovIn { from { opacity: 0; transform: translateY(18px); } }
.ovDark { background: #1b2140; }
.ovHead { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(8px + var(--sat)) 10px 8px; background: linear-gradient(#f3e4bf, #ead7a9); border-bottom: 3px solid var(--ink); position: relative; z-index: 5; }
.ovTitle { flex: 1; min-width: 0; text-align: center; }
.ovTitle h2 { margin: 0; font: 900 19px/1.15 var(--ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ovSub { font-size: 12px; font-weight: 800; color: var(--muted); }
.ovBody { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; position: relative; }
.scrollBody { flex: 1 1 auto; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; padding: 14px 14px calc(20px + var(--sab)); }
.ovFoot { flex: none; padding: 10px 14px calc(12px + var(--sab)); display: flex; flex-direction: column; align-items: center; gap: 8px; }

/* modal + toast */
.modal { position: absolute; inset: 0; z-index: 80; display: none; place-items: center; background: rgba(28, 18, 10, .45); padding: 20px; }
.modal.open { display: grid; animation: fadeIn .2s; }
.mBox { width: 100%; max-width: 380px; padding: 16px; }
.mBox h3 { margin: 0 0 6px; font: 900 18px var(--ui); }
.mBody p { line-height: 1.5; margin: 6px 0; }
.mBtns { display: flex; gap: 10px; margin-top: 14px; }
.mBtns .btn { flex: 1; }
.toast { position: absolute; left: 50%; top: calc(64px + var(--sat)); z-index: 90; transform: translate(-50%, -20px); opacity: 0; pointer-events: none; transition: all .3s; background: #2b1d14; color: #fff6dc; font-weight: 800; font-size: 14px; padding: 10px 16px; border-radius: 14px; max-width: 88%; text-align: center; box-shadow: 0 6px 18px rgba(0, 0, 0, .3); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
body:not(.ovOn) #scrMain.on ~ .toast { top: auto; bottom: calc(150px + var(--sab)); }

/* ---------- tụng kinh ---------- */

    2: [

window.XAM_QUE_A = [
  { so: 1, hang: 5, chude: "thanhdat", tich: "Đường Tăng đến Lôi Âm", ke: "Thầy trò Đường Tăng vượt muôn dặm, trải đủ tám mươi mốt nạn mới tới được chùa Lôi Âm thỉnh kinh. Quẻ ứng việc dài hơi sắp đến đích, bao công khó nay đã đơm hoa kết trái.", tho: ["Tám mươi mốt nạn qua rồi,", "Chuông chùa vang vọng đỉnh đồi Lôi Âm.", "Bao năm gieo hạt chờ mầm,", "Nay mùa trái ngọt đã cầm trong tay."], y: "Việc theo đuổi lâu nay sắp thành, cầu gì phần nhiều được nấy. Thành rồi nhớ ơn người cùng đi đường khó, giữ lòng khiêm hạ thì phúc còn dài." },
  { so: 2, hang: 1, chude: "thoi", tich: "Ngộ Không dưới chân núi Ngũ Hành", ke: "Tôn Ngộ Không cậy tài náo loạn thiên cung nên bị đè dưới núi Ngũ Hành suốt năm trăm năm, đến khi Đường Tăng đi ngang mới được cứu ra. Quẻ ứng lúc bị kìm chân, chỉ nên nhẫn nại chờ thời và sửa mình.", tho: ["Núi đè năm tháng chưa tan,", "Gió mưa mấy độ, rêu tràn đá xanh.", "Lặng yên giữ một tâm lành,", "Có người tìm đến, đường quanh mở dần."], y: "Vận đang bị kìm như đá đè, việc lớn chưa nên khởi sự, càng gắng gượng càng vướng. Cứ giữ lòng hiền, bớt nóng vội, rồi sẽ có người tìm đến gỡ rối cho mình." },
  { so: 3, hang: 4, chude: "thoi", tich: "Khương Tử Nha câu cá sông Vị", ke: "Khương Tử Nha ngồi bên sông Vị thả lưỡi câu thẳng không mồi, thong thả chờ đến tuổi tám mươi thì gặp Văn Vương đích thân đến mời về giúp nước. Quẻ dạy chữ thời: có tài cứ bình thản chuẩn bị, đúng lúc ắt được dùng.", tho: ["Sông trong buông sợi câu dài,", "Nước xuôi thong thả, mặc ai rộn ràng.", "Một mai xe giá ghé sang,", "Gặp thời như lúa chín vàng đầy sân."], y: "Việc mong cầu đã có mầm, chỉ là chưa tới lúc, đừng nóng ruột mà bỏ dở. Cứ bền lòng trau dồi, thời đến thì người tìm đến, việc thành trọn vẹn." },
  { so: 4, hang: 3, chude: "hoa", tich: "Mất ngựa ở khe Ưng Sầu", ke: "Qua khe Ưng Sầu, ngựa của Đường Tăng bị con rồng dưới suối nuốt mất, rồi chính rồng ấy hóa thành ngựa trắng, chở thầy suốt chặng đường thỉnh kinh. Quẻ ứng chuyện mất trước được sau, rủi hóa thành may.", tho: ["Bên khe vó ngựa không còn,", "Nước reo trắng xóa, đá mòn mù sương.", "Ngờ đâu ngựa trắng lên đường,", "Mất xưa được mới, dặm trường thênh thang."], y: "Việc trước mắt có điều hao hụt hoặc lỡ dở, chớ vội than buồn. Giữ lòng bình thản mà làm tiếp, cái mất hôm nay có thể mở ra cái được tốt hơn về sau." },
  { so: 5, hang: 5, chude: "quynhan", tich: "Yên Chiêu Vương dựng đài vàng", ke: "Yên Chiêu Vương muốn cầu người hiền, nghe lời Quách Ngỗi dựng đài vàng, hết lòng trọng đãi kẻ sĩ, nhờ vậy người tài bốn phương kéo về giúp nước Yên hưng thịnh. Quẻ báo quý nhân sẽ tự tìm đến cửa.", tho: ["Đài cao lấp lánh vàng son,", "Chim lành muôn nẻo, núi non tìm về.", "Cửa nhà rộng mở bốn bề,", "Hiền tài kéo đến, cùng kề vai nhau."], y: "Đang lúc được người quý mến nâng đỡ, cầu việc gì cũng có người góp sức, góp ý. Cứ thật lòng trọng người, mở cửa đón bạn, thì người tốt tự kéo đến bên mình." },
  { so: 6, hang: 5, chude: "doanvien", tich: "Anh em hội ngộ ở Cổ Thành", ke: "Sau ngày thất lạc, Quan Vũ vượt năm cửa ải đưa hai chị dâu đi tìm anh, cuối cùng ba anh em Lưu, Quan, Trương gặp lại nhau ở Cổ Thành. Quẻ báo người xa sắp về, nhà cửa sum vầy.", tho: ["Mấy mùa cách trở đôi đường,", "Nay về thành cũ, ánh dương rạng ngời.", "Anh em tay nắm giữa trời,", "Trăng rằm soi trọn một lời thề xưa."], y: "Người thân xa cách sắp đoàn tụ, chuyện lấn cấn trong nhà được tháo gỡ, tin vui từ phương xa gửi về. Việc chung bàn với người nhà thì mọi bề êm thuận." },
  { so: 7, hang: 3, chude: "tinh", tich: "Khổng Minh gảy đàn trên thành trống", ke: "Quân chủ lực đi vắng, Khổng Minh chỉ còn ít lính giữ thành, bèn mở toang cổng, ngồi trên lầu thong thả gảy đàn, khiến Tư Mã Ý ngờ có phục binh mà rút lui. Quẻ khuyên gặp lúc nguy chớ hoảng, lòng tĩnh thì tự có lối ra.", tho: ["Thành không mở cổng đón mây,", "Ngoài kia giáo mác chật đầy bốn phương.", "Tiếng đàn khoan nhặt du dương,", "Tâm yên thì giặc giữa đường tự lui."], y: "Đang có việc gây lo lắng mà sức mình lại mỏng, nhưng chưa đến nỗi nào. Giữ bình tĩnh, nghĩ kỹ rồi ứng phó, đừng để người khác thấy mình hoảng hốt mà lấn tới." },
  { so: 8, hang: 3, chude: "cancu", tich: "Chu Mãi Thần gánh củi đọc sách", ke: "Chu Mãi Thần nhà nghèo, ngày ngày lên núi đốn củi, vừa gánh vừa đọc sách, bị người đời chê cười vẫn không bỏ, về sau được trọng dụng làm quan. Quẻ ứng lúc còn vất vả, chịu khó học hỏi thì ngày sau ắt khá.", tho: ["Lưng mang bó củi lên non,", "Tay cầm quyển sách, lối mòn lá rơi.", "Mặc ai chê trách bao lời,", "Ngày dài chữ thấm, đến thời công danh."], y: "Hiện còn chật vật, công sức bỏ ra chưa thấy kết quả ngay, lại dễ bị người ngoài coi nhẹ. Cứ chăm chỉ học hỏi, làm đều tay, thành quả sẽ đến muộn mà chắc." },
  { so: 9, hang: 4, chude: "thanhdat", tich: "Quan Vũ về khi chén rượu còn ấm", ke: "Chư hầu bó tay trước Hoa Hùng, Quan Vũ khi ấy chỉ là cung thủ vô danh xin ra trận, chén rượu Tào Tháo rót tiễn còn ấm thì ông đã thắng trở về. Quẻ báo người bị xem nhẹ sắp có dịp tỏ tài.", tho: ["Chén nồng còn ấm trên tay,", "Trống chưa dứt nhịp, cờ bay về thành.", "Bấy lâu khuất bóng vô danh,", "Nay tài tự hiện, tiếng lành gần xa."], y: "Việc đang làm sắp có kết quả nhanh hơn dự tính, cơ hội thể hiện mình đã tới. Mạnh dạn nhận việc, làm cho gọn, thành công rồi vẫn giữ thái độ khiêm tốn." },
  { so: 10, hang: 3, chude: "thantrong", tich: "Lưu Bang dự tiệc Hồng Môn", ke: "Lưu Bang đến Hồng Môn dự tiệc của Hạng Vũ, giữa tiệc Hạng Trang múa kiếm chực ra tay, nhờ Trương Lương, Phàn Khoái che chở mới tìm cớ rút về an toàn. Quẻ dặn chỗ vui chưa chắc đã lành, phải giữ ý từng lời.", tho: ["Tiệc vui đàn sáo nhịp nhàng,", "Bóng gươm thấp thoáng sau hàng trúc xanh.", "Giữ lời, rảo bước cho nhanh,", "Ra về êm thấm, đường lành trăng soi."], y: "Có lời mời mọc, cuộc gặp hay việc hợp tác tưởng vui mà ẩn điều bất lợi. Nói ít, giữ ý, chớ ký kết hay hứa hẹn ngay tại chỗ, biết dừng đúng lúc thì việc vẫn yên." },
  { so: 11, hang: 2, chude: "thiphi", tich: "Ba người đồn chợ có cọp", ke: "Bàng Thông hỏi vua Ngụy: một người nói chợ có cọp thì chưa tin, ba người cùng nói thì vua có tin không, rồi xin vua đừng nghe lời gièm khi ông đi xa. Quẻ nhắc lời đồn lặp mãi dễ thành thật, thị phi làm mờ lẽ phải.", tho: ["Chợ đông một tiếng đồn vang,", "Ba người cùng nói, cả làng tin theo.", "Mặt hồ dẫu phủ lớp bèo,", "Đáy sâu nước vẫn trong veo một màu."], y: "Đang có lời ra tiếng vào, chuyện nhỏ bị đồn thành lớn, dễ mang tiếng oan. Bớt giải thích qua lại, cứ làm đúng việc mình, lâu ngày người ta sẽ tự thấy rõ trắng đen." },
  { so: 12, hang: 4, chude: "tichduc", tich: "Phùng Huyên đốt giấy nợ mua nghĩa", ke: "Phùng Huyên được Mạnh Thường Quân sai đi thu nợ ở đất Tiết, lại gom giấy nợ của dân nghèo đốt đi, nói là mua nghĩa cho chủ, về sau chủ sa cơ thì dân đất ấy kéo ra đón rước. Quẻ dạy rộng lòng hôm nay là chỗ dựa mai sau.", tho: ["Lửa hồng đốt sạch nợ nần,", "Xóm nghèo nhẹ gánh, tình thân đượm nồng.", "Mai sau lỡ bước qua sông,", "Bến quê người đứng chờ trông đón về."], y: "Lúc này rộng tay giúp người, bớt so đo thiệt hơn, cái nghĩa gieo ra sẽ thành chỗ dựa vững về sau. Làm ăn giữ chữ tín và lòng tử tế thì đường dài càng thuận." },
  { so: 13, hang: 4, chude: "cancu", tich: "Ngộ Không vượt biển tìm thầy học đạo", ke: "Hầu Vương muốn học điều chưa biết, một mình kết bè vượt biển, đi gần mười năm mới tìm được thầy, sớm hôm chăm chỉ hầu hạ rồi học được bảy mươi hai phép biến hóa. Quẻ ứng chí học bền bỉ ắt có ngày thành.", tho: ["Bè tre vượt sóng trùng khơi,", "Năm dài lặn lội tìm nơi học thầy.", "Sớm chiều quét lá dưới cây,", "Chuyên cần một dạ, ắt đầy túi khôn."], y: "Việc học, việc nghề đang đúng hướng, chỉ cần kiên trì và chịu nghe người giỏi chỉ dạy. Đi xa học thêm, theo bậc thầy rèn nghề lúc này đều có lợi." },
  { so: 14, hang: 2, chude: "thoi", tich: "Khương Tử Nha bán bột gặp gió", ke: "Lúc chưa gặp thời, Khương Tử Nha gánh bột ra chợ bán thì gặp gió lớn thổi bay sạch, làm gì cũng hỏng, bị người đời chê cười. Vận chưa tới thì cứ bình tâm, về sau ông vẫn thành bậc khai quốc công thần.", tho: ["Gánh ra chợ sớm gió lồng,", "Bột bay tứ tán, tay không ra về.", "Vận chưa tới, chớ ủ ê,", "Đông tàn, xuân lại tràn trề hoa tươi."], y: "Thời vận đang nghịch, làm gì cũng dễ hỏng, buôn bán khó trôi. Lúc này đừng mở rộng hay đổi nghề vội, giữ vốn, giữ sức, chờ qua mùa khó rồi mới tính." },
  { so: 15, hang: 2, chude: "haotai", tich: "Ngộ Không khoe áo cà sa", ke: "Ngộ Không đem áo cà sa quý của thầy ra khoe với sư già chùa nọ, khiến kẻ tham nổi lòng chiếm đoạt, rốt cuộc áo bị lấy mất, phải nhọc công lắm mới đòi về. Quẻ răn của quý chớ phô, khoe ra dễ hao tài.", tho: ["Đem khoe áo quý trước sân,", "Sắc màu lấp lóa, mắt gần mắt xa.", "Đêm về khách lạ ghé nhà,", "Của kia giữ kín mới là của ta."], y: "Có điềm hao của vì phô trương hoặc vì lòng tin đặt nhầm chỗ. Tài sản, giấy tờ quý nên cất kỹ, bớt kể chuyện tiền bạc với người ngoài, ai hỏi vay mượn lúc này nên khéo từ chối." },
  { so: 16, hang: 5, chude: "thoi", tich: "Khổng Minh mượn gió Đông", ke: "Trước trận Xích Bích, mọi kế đã sẵn chỉ còn thiếu gió đông, Khổng Minh đoán trước ngày trời trở gió, liên quân thừa thế phóng hỏa phá tan thủy trại của Tào Tháo. Quẻ báo thời đã tới, việc chuẩn bị lâu nay sắp thành.", tho: ["Thuyền neo bến đợi gió đông,", "Canh ba gió trở, khắp sông buồm đầy.", "Bao ngày tính toán là đây,", "Thời về như hội rồng mây tung hoành."], y: "Thời cơ đã chín, việc ấp ủ lâu nay gặp đúng lúc thuận, cứ mạnh dạn tiến hành. Mọi bề đã chuẩn bị kỹ thì thành công lớn, nhớ chia phần công lao cho người cùng sức." },
  { so: 17, hang: 3, chude: "nhan", tich: "Hàn Tín chịu nhục ở chợ Hoài Âm", ke: "Thuở hàn vi, Hàn Tín bị gã hàng thịt ở chợ Hoài Âm thách phải chui qua háng, ông nhẫn nhịn làm theo chứ không vì cơn giận mà hỏng đời, về sau thành danh tướng. Quẻ khuyên nhịn điều nhỏ để giữ đường lớn.", tho: ["Hàng tre trước gió nghiêng mình,", "Bão qua gốc vẫn yên bình giữa sân.", "Nhịn điều nhỏ, giữ tấm thân,", "Đường dài còn đợi bước chân vững vàng."], y: "Đang gặp chuyện bực mình, bị coi thường hoặc bị khiêu khích, nếu nổi nóng sẽ thiệt nhiều hơn được. Nhịn một lần, giữ sức cho việc lớn, thời gian sẽ trả lại công bằng." },
  { so: 18, hang: 3, chude: "quynhan", tich: "Quản Trọng thả ngựa già tìm đường", ke: "Tề Hoàn Công đi đánh nước Cô Trúc, lúc về lạc giữa vùng hoang mạc, Quản Trọng bảo thả mấy con ngựa già đi trước, quả nhiên ngựa dẫn cả đoàn tìm được lối ra. Quẻ khuyên lúc rối nên hỏi người từng trải.", tho: ["Lạc đường giữa bãi cát vàng,", "Chiều buông bụi cuốn mênh mang chân trời.", "Ngựa già biết lối thảnh thơi,", "Nghe lời người trước, tới nơi yên lành."], y: "Việc đang rối, tự mình loay hoay mãi chưa ra, nhưng có người từng trải sẵn lòng chỉ lối. Khiêm tốn hỏi ý cha mẹ, thầy cũ hay người lớn tuổi, việc sẽ dần thông." },
  { so: 19, hang: 1, chude: "thantrong", tich: "Trương Phi say rượu mất Từ Châu", ke: "Lưu Bị giao Từ Châu cho Trương Phi giữ, dặn kiêng rượu, nhưng Trương Phi say sưa đánh mắng người dưới, để Lã Bố nhân đêm chiếm mất thành. Quẻ răn một phút buông lơi có thể mất cả cơ nghiệp.", tho: ["Canh khuya chén rượu say mềm,", "Cổng thành bỏ ngỏ, gió đêm rì rào.", "Tỉnh ra mất cả thành cao,", "Từ nay gương ấy khắc vào tâm can."], y: "Vận đang thấp, dễ vì một lúc lơ là hay ham vui mà hỏng việc được giao. Bớt rượu chè, giữ giờ giấc, việc gì cũng kiểm tra lại hai lần thì dần lấy lại được lòng tin của người." },
  { so: 20, hang: 3, chude: "doimoi", tich: "Triệu Vũ Linh Vương mặc áo Hồ", ke: "Triệu Vũ Linh Vương thấy áo dài tay rộng bất tiện khi ra trận, bèn cho quân mặc áo gọn kiểu người Hồ, tập cưỡi ngựa bắn cung, mặc ai phản đối, nước Triệu nhờ vậy mạnh lên. Quẻ khuyên mạnh dạn đổi cách làm cho hợp thời.", tho: ["Áo dài tay rộng vướng chân,", "Đổi sang áo gọn, tấm thân nhẹ nhàng.", "Dẫu lời can gián ngổn ngang,", "Thảo nguyên lộng gió, rỡ ràng đường đi."], y: "Cách làm cũ đã không còn hợp, càng giữ càng vướng. Nên mạnh dạn thay đổi từng phần, học cái hay của người khác, dù lúc đầu bị bàn ra tán vào cũng đừng nản." },
  { so: 21, hang: 4, chude: "quynhan", tich: "Tiêu Hà đuổi Hàn Tín dưới trăng", ke: "Hàn Tín ở dưới trướng Lưu Bang mãi không được dùng, bèn bỏ đi trong đêm, Tiêu Hà hay tin vội phi ngựa đuổi theo dưới trăng, kéo về tiến cử làm đại tướng. Quẻ báo có người biết tài mình, sắp ra tay nâng đỡ.", tho: ["Đêm thanh lối nhỏ dặm dài,", "Lặng thầm rời bước, nào ai ngỡ rằng.", "Vó câu đuổi dưới bóng trăng,", "Người sành biết ngọc, nâng bằng hai tay."], y: "Tài năng bấy lâu chưa ai biết đến nay sắp gặp người trọng dụng, đừng vội nản mà bỏ ngang. Có người đứng ra tiến cử hay nâng đỡ thì nên nhận lời và làm hết sức." },
  { so: 22, hang: 3, chude: "tichduc", tich: "Lưu Bị dắt dân qua sông", ke: "Bị Tào Tháo truy đuổi, Lưu Bị vẫn không nỡ bỏ mười vạn dân theo mình, cùng dắt nhau qua sông dù đi chậm và gặp nhiều hiểm nguy. Lòng nhân ấy về sau giúp ông được thiên hạ quy phục, quẻ ứng chữ đức tuy vất vả mà bền.", tho: ["Dắt dìu già trẻ qua sông,", "Bùn sâu chậm bước, quyết không bỏ người.", "Gian nan mà vẫn nụ cười,", "Lòng nhân ấm tựa nắng tươi đầu ngày."], y: "Việc còn chậm và vất vả, nhưng giữ lòng nhân hậu, không bỏ rơi người cùng cảnh thì về sau được nhiều người tin theo. Đừng vì lợi trước mắt mà quay lưng với người đã tin mình." },
  { so: 23, hang: 2, chude: "thantrong", tich: "Mã Tốc mất Nhai Đình", ke: "Mã Tốc thuộc làu binh thư nhưng tự phụ, không nghe lời dặn của Khổng Minh, đóng quân trên núi xa nguồn nước nên bị vây và để mất Nhai Đình. Quẻ răn chớ cậy giỏi lý thuyết mà xem nhẹ lời dặn của người đi trước.", tho: ["Đồi cao dựng trại xa nguồn,", "Dặn dò gác lại, nỗi buồn đến mau.", "Thuộc làu sách vở trước sau,", "Chẳng bằng biết lắng nghe nhau một lời."], y: "Việc đang làm dễ hỏng vì chủ quan, tự cho mình hiểu hết mà bỏ qua lời nhắc của người có kinh nghiệm. Đọc kỹ giấy tờ, làm đúng điều đã thỏa thuận, đừng tự ý đổi kế hoạch." },
  { so: 24, hang: 2, chude: "tinh", tich: "Tưởng Cán lấy trộm thư giả", ke: "Tưởng Cán sang trại Chu Du dò la, thấy bức thư để sẵn trên bàn liền lấy trộm đem về, nào ngờ đó là thư giả khiến Tào Tháo mắc mưu, nghi oan hai tướng thủy quân giỏi nhất. Quẻ răn thứ đến tay quá dễ thường có bẫy.", tho: ["Đèn mờ thư để trên bàn,", "Chủ nằm giả ngủ, khách gian mừng thầm.", "Nào hay chữ giả tay cầm,", "Của rơi dễ nhặt, lỗi lầm khó phai."], y: "Gặp tin tức, món lợi hay lời mời đến quá dễ thì nên ngờ trước. Kiểm chứng kỹ nguồn tin, hỏi người tin cậy rồi mới quyết, chậm một chút mà khỏi mắc mưu người." },
  { so: 25, hang: 1, chude: "haotai", tich: "Nước Ngu tham ngọc cho mượn đường", ke: "Nước Tấn đem ngọc bích và ngựa quý tặng vua Ngu để mượn đường đánh nước Quắc, vua Ngu tham quà không nghe lời can, rốt cuộc Tấn lấy Quắc rồi tiện đường chiếm luôn nước Ngu. Quẻ răn tham lợi nhỏ mất cơ nghiệp lớn.", tho: ["Ngọc ngà ngựa quý đem trao,", "Mở đường cho khách, lòng nào nghĩ xa.", "Láng giềng đổ, lạnh mái nhà,", "Quà sang của lạ người ta chớ màng."], y: "Vận thấp, dễ vì ham lợi trước mắt mà mất phần lớn, nhất là cho mượn, đứng tên, bảo lãnh. Khéo từ chối quà cáp và lời hứa lợi lớn, giữ chặt của mình thì tai qua nạn khỏi." },
  { so: 26, hang: 4, chude: "nhan", tich: "Liêm Pha cõng roi gai tạ tội", ke: "Lạn Tương Như được phong cao hơn, Liêm Pha bất bình; Tương Như vì việc nước nhiều lần nhường tránh, Liêm Pha hiểu ra liền cõng roi gai đến xin lỗi, hai người thành bạn thân. Quẻ dạy nhường một bước là thắng cả đôi bên.", tho: ["Ngõ quanh xe chạm mặt nhau,", "Một người lặng lẽ lùi sau bên đường.", "Bên kia hối lỗi nhún nhường,", "Roi gai đổi lấy tình thương trọn đời."], y: "Có người hiểu lầm hay ganh tị với mình, đừng đối đầu mà hãy nhường nhịn vì việc chung. Giữ được bình tĩnh thì chẳng bao lâu người ấy tự hiểu ra, oán cũ hóa thành tình thân." },
  { so: 27, hang: 3, chude: "hoa", tich: "Lưu Bị sang Đông Ngô thành thân", ke: "Đông Ngô bày kế gả em gái Tôn Quyền để dụ Lưu Bị sang giữ làm tin, nhờ Khổng Minh liệu trước và được Ngô Quốc Thái ưng ý, mưu kế hóa thành mối lương duyên thật. Quẻ ứng chuyện tưởng là bẫy lại hóa thành phúc.", tho: ["Sang ngang lòng những phân vân,", "Ngỡ rằng cạm bẫy đến gần quanh ta.", "Đèn hồng rực rỡ tiếng ca,", "Rủi kia hóa lại thành ra duyên lành."], y: "Việc tưởng bất lợi, thậm chí có người giăng bẫy, nhưng nhờ khéo léo và có người trên che chở mà hóa thành chuyện tốt. Giữ lòng ngay, bàn kỹ với người tin cậy, mọi chuyện sẽ êm." },
  { so: 28, hang: 1, chude: "thiphi", tich: "Trụ Vương đề thơ đền Nữ Oa", ke: "Trụ Vương đến viếng đền Nữ Oa, thấy tượng đẹp liền đề bài thơ khinh nhờn lên vách, chỉ từ một lời bất kính ấy mà chuốc lấy bao rối ren cho cả triều Thương. Quẻ răn lời nói, chữ viết đã đưa ra thì khó lòng rút lại.", tho: ["Bút nghiêng một nét đề tường,", "Gió đưa câu chữ phố phường xa xôi.", "Như chum nước đã đổ rồi,", "Giữ lời trên lưỡi đầu môi cho lành."], y: "Vận đang thấp, một câu nói đùa hay dòng chữ viết vội cũng dễ gây hiểu lầm, kéo theo tranh cãi. Bớt bình phẩm, bớt đưa chuyện riêng lên mạng, lời nào chưa chắc thì đừng nói." },
  { so: 29, hang: 4, chude: "doimoi", tich: "Điền Kỵ đua ngựa", ke: "Điền Kỵ đua ngựa với vua Tề hay thua, Tôn Tẫn bảo đổi thứ tự: ngựa kém đấu ngựa giỏi nhất, ngựa giỏi đấu ngựa vừa, ngựa vừa đấu ngựa kém, nhờ vậy thắng hai trong ba. Quẻ dạy vốn như cũ, khéo xếp lại là đổi được thế cờ.", tho: ["Cũng ba con ngựa ấy thôi,", "Khéo bày thứ tự đổi ngôi, hợp thời.", "Vốn còn, cách mới đổi đời,", "Thua xưa hóa thắng, sáng ngời ngày mai."], y: "Sức người, vốn liếng vẫn vậy, chỉ cần đổi cách sắp xếp, đổi thứ tự ưu tiên là tình thế xoay chiều. Mạnh dạn thử cách làm mới, lấy sở trường bù sở đoản thì việc sẽ thuận." },
  { so: 30, hang: 5, chude: "cancu", tich: "Tô Tần đeo ấn sáu nước", ke: "Tô Tần đi du thuyết thất bại, về nhà bị người thân ghẻ lạnh, bèn đóng cửa miệt mài đọc sách thâu đêm, về sau thuyết phục được sáu nước liên kết, một mình đeo ấn tướng của cả sáu. Quẻ ứng khổ công ắt thành danh.", tho: ["Ngọn đèn thức trắng bên song,", "Sách dày lật mãi, một lòng chẳng lơi.", "Rồi ra sáu nước theo lời,", "Về làng áo gấm, khắp nơi đón chào."], y: "Công sức khổ luyện bấy lâu sắp được đền đáp, việc học, thi cử, sự nghiệp đều có tin vui lớn. Thành công rồi nhớ đối đãi tử tế với người thân, kể cả người từng không tin mình." },
  { so: 31, hang: 4, chude: "tinh", tich: "Lạn Tương Như đem ngọc về Triệu", ke: "Vua Tần hứa đổi mười lăm thành lấy ngọc bích họ Hòa của Triệu, Lạn Tương Như mang ngọc sang, nhận ra lời hứa chỉ là cái bẫy nên khéo léo đòi lại ngọc và đưa về Triệu nguyên vẹn. Quẻ dạy tỉnh táo trước lời hứa ngọt.", tho: ["Mười lăm thành hứa đổi ngay,", "Lời như mật ngọt, trao tay ngọc lành.", "Lòng trong nhìn rõ ngọn ngành,", "Ngọc về nguyên vẹn, rạng danh nước nhà."], y: "Có người hứa lợi lớn để đổi lấy thứ quý của mình như tiền bạc, giấy tờ. Cứ tỉnh táo đòi điều kiện rõ ràng, thấy không thật thì rút lui khéo, giữ được của mà vẫn được tiếng." },
  { so: 32, hang: 3, chude: "thoi", tich: "Văn Vương diễn Dịch ở Dũ Lý", ke: "Tây Bá Hầu Cơ Xương bị Trụ Vương giam ở Dũ Lý bảy năm, không oán thán mà dùng thời gian ấy suy ngẫm, diễn sáu mươi tư quẻ Dịch, đến khi được tha về thì đức độ càng sáng. Quẻ dạy lúc bị giữ chân hãy lặng lẽ chuẩn bị.", tho: ["Bảy năm cửa khép then cài,", "Ngồi yên ngẫm lẽ, chẳng ai hay mình.", "Âm dương vạch rõ sự tình,", "Đến ngày cửa mở, bình minh ửng hồng."], y: "Đang lúc bị ràng buộc, chưa xoay xở được nhiều, càng nôn nóng càng mệt. Hãy dùng quãng thời gian này để học thêm, sắp xếp lại suy nghĩ, khi thời mở ra thì đã sẵn sàng." },
  { so: 33, hang: 4, chude: "doanvien", tich: "Dĩnh Khảo Thúc khuyên vua gặp mẹ", ke: "Trịnh Trang Công giận mẹ, thề không gặp lại, Dĩnh Khảo Thúc được ban cơm xin để dành miếng ngon về biếu mẹ khiến vua động lòng, rồi bày cách cho mẹ con gặp nhau mà vua vẫn giữ lời. Quẻ báo giận hờn trong nhà sắp tan.", tho: ["Giận hờn một độ xa nhau,", "Mẹ già tựa cửa, bạc màu tóc sương.", "Nhờ người khéo mở con đường,", "Mẹ con sum họp, yêu thương vẹn tròn."], y: "Chuyện giận hờn, xa cách trong nhà sắp được hàn gắn, nhất là giữa cha mẹ và con cái. Có người đứng giữa khéo nói thì nên nghe, mình chủ động hạ giọng trước cũng chẳng thiệt gì." },
  { so: 34, hang: 3, chude: "haotai", tich: "Mất dê mới lo sửa chuồng", ke: "Trang Tân khuyên vua Sở: mất dê rồi mới sửa chuồng vẫn chưa muộn, thấy thỏ rồi mới gọi chó vẫn còn kịp, miễn là biết sửa ngay. Quẻ ứng đã có chỗ hao hụt, nhưng sửa ngay thì vẫn kịp.", tho: ["Rào thưa dê lạc mất rồi,", "Đừng than tiếc của, hãy ngồi vá ngay.", "Nan tre đan chặt từng tay,", "Đàn còn lại đó, mai này ấm êm."], y: "Đã có chỗ hao hụt hoặc sơ hở trong chuyện tiền nong, giấy tờ, nhưng chưa muộn. Rà lại sổ sách, bịt chỗ hở, bớt chi tiêu không cần thiết thì giữ được phần còn lại và dần khá lên." },
  { so: 35, hang: 2, chude: "hoa", tich: "Tôn Tẫn giả dại thoát nạn", ke: "Tôn Tẫn bị bạn đồng môn Bàng Quyên ghen tài hãm hại, ông giả dại cho kẻ kia lơi canh giữ, rồi theo sứ nước Tề trốn thoát, về sau thành bậc quân sư lừng danh. Quẻ ứng trong cái khó ló cái khôn, họa chuyển thành phúc.", tho: ["Mùa đông cây trụi lá cành,", "Tưởng như khô héo, mầm xanh ẩn lòng.", "Âm thầm chờ buổi trời trong,", "Qua cơn giá rét, thong dong xuân về."], y: "Đang gặp người không tốt hoặc hoàn cảnh bó buộc, chưa thể đối đầu. Cứ khiêm nhường, giấu bớt tài, lặng lẽ tìm đường lui, qua cơn khó này sẽ gặp vận mới và người biết dùng mình." },
  { so: 36, hang: 2, chude: "thiphi", tich: "Ba lần đánh Bạch Cốt Tinh", ke: "Bạch Cốt Tinh ba lần hóa thành người lành để lừa Đường Tăng, Ngộ Không nhìn ra nên ra tay trừ, nhưng thầy nghe Bát Giới xúi bẩy, trách oan rồi đuổi trò đi. Quẻ ứng lời gièm pha làm rạn vỡ tình thân.", tho: ["Lời gièm rỉ rả bên tai,", "Người ngay chịu tiếng, oan sai một lần.", "Mây che mờ mắt người thân,", "Gió xua mây hết, mới phân thật lòng."], y: "Đang có kẻ đứng giữa đặt điều, dễ khiến mình nghi oan người tốt hoặc bị người thân hiểu lầm. Nghe một phía thì chớ vội phán xét, gặp nhau nói thẳng thì hiểu lầm sẽ tan." },
  { so: 37, hang: 3, chude: "tinh", tich: "Chân giả Mỹ Hầu Vương", ke: "Lục Nhĩ Mỹ Hầu giả dạng Tôn Ngộ Không giống hệt từ dáng đến giọng, đi khắp trời đất không ai phân biệt nổi, mãi đến nơi có bậc tinh tường soi xét mới lộ chân tướng. Quẻ dạy thật giả lẫn lộn, phải xét tận gốc mới tin.", tho: ["Hai hình một dáng như in,", "Tiếng nghe cũng giống, mắt nhìn còn mơ.", "Thật thì chẳng sợ chi vờ,", "Xét cho tận gốc, đôi bờ phân minh."], y: "Có chuyện thật giả lẫn lộn, như người mạo danh, tin đồn hay giấy tờ không rõ gốc. Đừng vội tin hay làm theo, cứ kiểm chứng tận nơi, hỏi người hiểu chuyện, sự thật sẽ sáng tỏ." },
  { so: 38, hang: 5, chude: "doimoi", tich: "Khỉ đá nhảy qua thác Thủy Liêm", ke: "Bầy khỉ thấy thác nước đổ ào, hẹn ai dám nhảy qua sẽ tôn làm vua, khỉ đá bạo gan nhảy vào, thấy sau màn nước là động Thủy Liêm rộng đẹp, được tôn làm Mỹ Hầu Vương. Quẻ báo dám bước qua nỗi sợ thì đất lành đang đợi.", tho: ["Thác cao rèm nước buông mành,", "Một phen nhảy vút, động xanh hiện bày.", "Phía sau cõi ấy đẹp thay,", "Dám đi một bước, đổi ngay cơ đồ."], y: "Đang đứng trước lựa chọn mới như đổi nghề, dời chỗ ở hay mở việc riêng, trông đáng ngại mà thật ra rất thuận. Đã tính kỹ thì mạnh dạn bước tới, phía trước là chỗ đứng vững vàng." },
  { so: 39, hang: 4, chude: "quynhan", tich: "Tam cố thảo lư", ke: "Lưu Bị ba lần tìm đến lều cỏ Long Trung, có lần đội tuyết, hai lần không gặp vẫn không nản, lần thứ ba mới được Gia Cát Lượng tiếp, từ đó có bậc quân sư giúp gây dựng cơ nghiệp. Quẻ ứng lòng thành ắt gặp quý nhân.", tho: ["Ba lần đội tuyết qua đèo,", "Lều tranh khép cửa, gió reo trúc ngà.", "Lòng thành nào ngại đường xa,", "Người hiền mở cửa, chén trà tri âm."], y: "Việc cần người giúp sức sẽ gặp được bậc tài đức, nhưng phải kiên trì và hết lòng thành, đừng nản sau một hai lần bị từ chối. Đã gặp được người giỏi thì tin dùng, chịu nghe góp ý." },
  { so: 40, hang: 3, chude: "cancu", tich: "Ba lần mượn quạt Ba Tiêu", ke: "Muốn qua núi Hỏa Diệm, Ngộ Không mượn quạt Ba Tiêu của Thiết Phiến Công Chúa, lần đầu bị quạt bay xa, lần sau nhận nhầm quạt giả, lần thứ ba mới có quạt thật dập tắt lửa. Quẻ dạy việc khó phải bền chí làm nhiều lần.", tho: ["Lửa đâu cháy đỏ non cao,", "Hai phen hỏng việc, lẽ nào chịu thua.", "Lần ba quạt phẩy gió lùa,", "Lửa tan, mưa mát, đón mùa lúa xanh."], y: "Việc đang làm gặp trở ngại, thử một hai lần chưa xong, dễ nản lòng. Chịu khó tìm hiểu lại, đổi cách tiếp cận rồi làm thêm lần nữa, kiên trì đến cùng thì việc khó cũng thành." },
  { so: 41, hang: 3, chude: "nhan", tich: "Câu Tiễn nằm gai nếm mật", ke: "Việt Vương Câu Tiễn thua trận phải sang hầu hạ nước Ngô, về nước ông nằm trên củi gai, treo mật đắng nếm mỗi ngày để nhớ nỗi nhục, chăm lo dân, mười năm sau nước Việt hưng thịnh lại. Quẻ dạy chữ nhẫn đi cùng chí bền.", tho: ["Củi gai làm chiếu nằm đêm,", "Mật treo trước mặt, nếm thêm mỗi ngày.", "Mười năm nhẫn nhịn cấy cày,", "Đất nghèo nay đã đổi thay xóm làng."], y: "Đang ở thế yếu, phải chịu thiệt hay chịu lép một thời gian. Đừng than trách, cứ âm thầm tích lũy sức lực, học hỏi và làm việc chăm chỉ, vài năm sau tình thế sẽ khác hẳn." },
  { so: 42, hang: 2, chude: "cancu", tich: "Người nước Tống ôm cây đợi thỏ", ke: "Người nông dân nước Tống thấy con thỏ chạy va vào gốc cây, nhặt được không tốn sức, từ đó bỏ cày ngồi canh gốc cây chờ thỏ khác, ruộng thành cỏ hoang. Quẻ răn chớ trông chờ may rủi, phải quay về với công việc thật.", tho: ["Gốc cây ngồi đợi suốt ngày,", "Thỏ đâu chẳng thấy, cỏ dày bờ mương.", "Thôi về vác cuốc lên nương,", "Cần cù dãi nắng dầm sương, được mùa."], y: "Đừng trông vào vận may hay món lợi bất ngờ từng gặp một lần, càng chờ càng lỡ việc chính. Quay về chăm lo công việc thường ngày, làm đều tay thì của cải mới bền." },
  { so: 43, hang: 2, chude: "tichduc", tich: "Quan Vũ tha Tào Tháo ở Hoa Dung", ke: "Thua to ở Xích Bích, Tào Tháo chạy đến đường Hoa Dung thì gặp Quan Vũ chặn lối, ông nhắc lại ân tình ngày trước, Quan Vũ động lòng mở đường cho đi. Quẻ ứng lúc sa cơ, cái ơn mình từng làm sẽ quay lại cứu mình.", tho: ["Thua về lối hẹp mưa giăng,", "Đường lầy chân mỏi, tưởng rằng hết trông.", "Ơn xưa người vẫn ghi công,", "Nương tay cho thoát cơn giông bất ngờ."], y: "Đang gặp lúc thất thế, đường lui hẹp, nhưng nhờ những điều tốt từng làm cho người mà được nương tay. Từ nay càng nên sống tử tế, gieo ơn không cần nhớ, phúc ấy sẽ tự quay về." },
  { so: 44, hang: 4, chude: "tichduc", tich: "Đề Oanh dâng thư cứu cha", ke: "Cha bị giải về kinh chịu tội, cô con gái nhỏ Đề Oanh theo lên Trường An, dâng thư xin làm tớ để chuộc tội cho cha, Hán Văn Đế cảm động tha tội và bỏ lối hình phạt nặng. Quẻ ứng lòng hiếu xoay chuyển được việc khó.", tho: ["Ngàn trùng con nhỏ theo cha,", "Một phong thư mỏng gửi qua cung vàng.", "Lời con hiếu thảo rõ ràng,", "Lòng người cảm động, mở đàng khoan dung."], y: "Lòng hiếu thảo và sự chân thành sẽ lay động được người có quyền quyết định, việc khó có cơ xoay chuyển. Lo cho cha mẹ chu đáo, nói lời thật lòng, phúc lành sẽ đến với cả nhà." },
  { so: 45, hang: 4, chude: "thanhdat", tich: "Mao Toại tự tiến", ke: "Bình Nguyên Quân chọn người theo sang Sở cầu viện còn thiếu một, Mao Toại xin tự tiến cử, tới nơi lời lẽ cứng cỏi thuyết phục được vua Sở liên minh, ai nấy đều nể phục. Quẻ báo đã đến lúc tự giới thiệu mình.", tho: ["Dùi trong túi vải lâu ngày,", "Gặp khi việc gấp, ló ngay mũi tài.", "Một lời đanh thép không sai,", "Việc thành, tiếng tốt trải dài muôn nơi."], y: "Cơ hội đang mở cho người dám bước ra, đừng ngại mình chưa có tiếng. Mạnh dạn xin nhận việc, trình bày ý kiến rõ ràng, chuẩn bị kỹ thì được trọng dụng và việc lớn sẽ thành." },
  { so: 46, hang: 3, chude: "doanvien", tich: "Tào Thực bảy bước thành thơ", ke: "Tào Phi ghét em là Tào Thực, ép làm xong bài thơ trong bảy bước, Tào Thực ví anh em như đậu bị nấu bằng chính cành đậu, cùng một gốc sinh ra, khiến anh động lòng mà nương tay. Quẻ ứng chuyện nhà cần lời mềm mỏng.", tho: ["Cùng chung một gốc mà ra,", "Cành khô nỡ đốt hạt già, lửa reo.", "Câu thơ bảy bước nhẹ gieo,", "Lửa lòng dịu xuống, tình theo nghĩa nhà."], y: "Trong nhà hay giữa anh chị em đang có ganh đua, nặng lời, dễ làm tổn thương nhau. Ai mềm mỏng trước người ấy được, một lời nhắc tình ruột thịt lúc này có sức hơn mọi tranh cãi." },
  { so: 47, hang: 5, chude: "quynhan", tich: "Trương Lương nhặt dép cho ông lão", ke: "Trương Lương gặp ông lão trên cầu cố ý đánh rơi dép, bảo nhặt lên xỏ vào cho mình, chàng nhẫn nại làm theo, lại mấy lần dậy sớm đến hẹn, cuối cùng được trao bộ binh thư quý. Quẻ báo lòng kính người trên sẽ gặp quý nhân.", tho: ["Đầu cầu sương sớm còn mờ,", "Dép rơi cúi nhặt, đợi chờ chẳng than.", "Mấy phen đến trước canh tàn,", "Người trao quyển sách, muôn vàn lối đi."], y: "Đang có quý nhân thử lòng mình bằng những việc nhỏ, ai kiên nhẫn và lễ độ sẽ được nâng đỡ hết lòng. Kính người lớn tuổi, giữ đúng hẹn, việc học và sự nghiệp sẽ có bước tiến lớn." },
  { so: 48, hang: 2, chude: "doimoi", tich: "Muốn sang Sở lại đánh xe lên bắc", ke: "Có người muốn sang nước Sở phương nam lại đánh xe về phía bắc, còn khoe ngựa khỏe, tiền nhiều, người đánh xe giỏi, nào biết mấy thứ ấy càng tốt càng xa đích. Quẻ răn sai hướng thì càng gắng càng lạc, nên quay đầu sớm.", tho: ["Xe nhanh ngựa khỏe đi hoài,", "Hướng nam muốn tới, lại ngoài bắc phương.", "Càng đi càng lạc xa đường,", "Quay đầu chưa muộn, nắng vương lối về."], y: "Mục tiêu thì đúng mà cách đi đang ngược hướng, sức bỏ ra nhiều mà kết quả chẳng bao nhiêu. Dừng lại xem xét, hỏi người hiểu việc, sửa hướng ngay từ bây giờ thì vẫn kịp." },
  { so: 49, hang: 1, chude: "nhan", tich: "Lưu Bị giận dữ thua trận Di Lăng", ke: "Lưu Bị vì giận Đông Ngô mà gạt hết lời can, dốc toàn quân sang đánh, bị Lục Tốn dùng lửa đốt liên doanh bảy trăm dặm, thua to ở Di Lăng. Quẻ răn lúc nóng giận chớ quyết việc lớn.", tho: ["Giận như lửa bén ngút ngàn,", "Bảy trăm dặm trại, khói tràn đêm thâu.", "Lửa tàn mới ngẫm vì đâu,", "Lặng lòng như nước hồ sâu mới bền."], y: "Vận đang xuống, lại dễ nóng giận vì thua thiệt hay bất công, làm theo cơn giận sẽ thiệt thêm. Hoãn mọi quyết định lớn, nghe người thân can ngăn, đợi lòng nguội rồi hãy tính." },
  { so: 50, hang: 5, chude: "thanhdat", tich: "Trùng Nhĩ sau mười chín năm về nước", ke: "Công tử Trùng Nhĩ nước Tấn lưu lạc mười chín năm, nếm đủ khổ cực mà vẫn giữ lòng người theo mình, ngoài sáu mươi tuổi mới về nước lên ngôi, thành Tấn Văn Công lừng lẫy. Quẻ báo bao năm bôn ba nay đến ngày vinh hiển.", tho: ["Phong trần mười chín năm qua,", "Đất người lưu lạc, quê nhà vẫn mong.", "Thuyền về cập bến xuôi dòng,", "Muôn dân mở hội, tấm lòng hân hoan."], y: "Bao năm vất vả, xa quê hay lận đận nay đến lúc được đền đáp, công danh, nhà cửa đều khởi sắc. Giữ lòng biết ơn những người từng sát cánh lúc khó, phúc lộc sẽ còn bền lâu." }
];

/* ===== Quẻ xăm 51–100 ===== */
window.XAM_QUE_B = [
  { so: 51, hang: 1, chude: "nhan", tich: "Quan Âm Thị Kính chịu oan", ke: "Thị Kính hiền lành mà hai lần mang tiếng oan, vẫn lặng lẽ nhẫn nhục, nuôi đứa trẻ không phải con mình, đến sau cùng sự thật mới sáng tỏ. Quẻ này gặp lúc bị hiểu lầm, càng cãi càng rối, giữ lòng ngay thì trắng đen sẽ rõ.", tho: ["Mưa dầm ướt mái chùa tranh,", "Oan khiên một gánh đã đành lặng thinh.", "Nhịn lời, giữ lấy tâm bình,", "Mây tan rồi cũng thấy mình sáng trong."], y: "Đang lúc dễ bị hiểu lầm hay mang tiếng oan, nói nhiều chỉ thêm rối. Cứ nhẫn nhịn, sống ngay thẳng, để thời gian làm chứng thì lòng người sẽ tự sáng ra." },
  { so: 52, hang: 3, chude: "hoa", tich: "Mai An Tiêm trồng dưa ngoài đảo", ke: "Bị đày ra đảo hoang, Mai An Tiêm không than trách mà nhặt hạt chim rơi gieo thành ruộng dưa, khắc tên thả biển cho đến ngày được vua đón về. Quẻ này cái rủi trước mắt có thể thành cái may nếu chịu bắt tay vào làm.", tho: ["Biển khơi cát trắng mênh mông,", "Hạt chim đánh rớt, vun trồng thành dưa.", "Khắc tên thả sóng sớm trưa,", "Có ngày thuyền đến đón đưa về bờ."], y: "Việc trước mắt tưởng là rủi nhưng lại là dịp để mình tự đứng lên. Chịu khó làm từ hai bàn tay, kiên nhẫn chờ thêm, tin vui sẽ theo con nước mà về." },
  { so: 53, hang: 4, chude: "thoi", tich: "Sơn Tinh đến trước rước Mỵ Nương", ke: "Vua Hùng hẹn ai mang đủ voi chín ngà, gà chín cựa, ngựa chín hồng mao đến trước thì được cưới Mỵ Nương, Sơn Tinh lo sẵn từ đêm nên vừa sáng đã tới. Quẻ này chuẩn bị chu đáo và đi sớm một bước thì thời cơ thuộc về mình.", tho: ["Trời vừa hửng sáng đầu non,", "Voi ngà gà cựa chẳng còn chờ mai.", "Cửa vua vừa mở then cài,", "Sớm chân một bước, không ai giành phần."], y: "Thời cơ tốt đang mở ra nhưng chỉ đến với người chuẩn bị sẵn và chịu đi sớm. Việc định làm hãy lo cho đủ rồi mạnh dạn bước tới, chậm chân dễ lỡ dịp." },
  { so: 54, hang: 2, chude: "thoi", tich: "Trương Kế đêm đậu thuyền bến Phong Kiều", ke: "Tương truyền Trương Kế lỡ khoa thi, đêm đậu thuyền ở bến Phong Kiều, nghe chuông chùa Hàn San vọng lại mà viết nên bài thơ để đời. Quẻ này chưa gặp thời, cứ lặng lòng, việc lỡ hôm nay có khi lại thành điều đáng nhớ.", tho: ["Bến khuya thuyền đậu một mình,", "Chuông chùa đưa tiếng, lời kinh dịu lòng.", "Lỡ đò thôi, chớ ngóng mong,", "Sáng mai nước lớn xuôi dòng thênh thang."], y: "Việc mong cầu lúc này chưa thành, như người lỡ chuyến đò cuối ngày. Đừng vội buồn hay cố chen, cứ nghỉ ngơi lấy sức, đợi con nước sau sẽ thuận đường hơn." },
  { so: 55, hang: 4, chude: "quynhan", tich: "Phạm Ngũ Lão ngồi đan sọt", ke: "Phạm Ngũ Lão ngồi đan sọt bên đường, mải nghĩ việc lớn đến nỗi đoàn quân của Hưng Đạo Vương đi qua cũng không hay, nhờ vậy được ông để ý và thu nhận. Quẻ này cứ chuyên tâm làm việc của mình, quý nhân sẽ tự nhìn thấy.", tho: ["Bên đường tay chuốt nan tre,", "Mải lo việc lớn, chẳng nghe tiếng người.", "Quan trên dừng ngựa mỉm cười,", "Từ đây vận mở hoa tươi bốn mùa."], y: "Cứ chuyên tâm làm tốt việc của mình, đừng lo không ai biết đến. Người có tài, có lòng sớm muộn cũng được quý nhân để mắt, nâng đỡ cho tiến xa." },
  { so: 56, hang: 3, chude: "thiphi", tich: "Thầy bói xem voi", ke: "Năm ông thầy bói, mỗi người sờ một chỗ trên mình voi rồi cãi nhau không dứt, ai cũng cho mình đúng mà chẳng ai thấy cả con voi. Quẻ này dễ vướng chuyện bàn ra tán vào, nên nghe đủ các phía trước khi nói.", tho: ["Chợ chiều tiếng nói xôn xao,", "Mỗi người một mảnh, biết sao vẹn tròn.", "Lời qua tiếng lại mỏi mòn,", "Lùi xa mới thấy núi non trọn hình."], y: "Chuyện quanh mình đang lắm lời qua lại, ai cũng chỉ biết một phần. Nói ít lại, nghe cho đủ các bên rồi hãy kết luận, tránh được nhiều điều mất lòng." },
  { so: 57, hang: 4, chude: "cancu", tich: "Lý Bạch gặp bà lão mài chày sắt", ke: "Thuở nhỏ Lý Bạch bỏ học đi chơi, gặp bà lão bên suối ngồi mài chày sắt để làm cây kim, cậu ngộ ra rồi quay về chăm chỉ đèn sách. Quẻ này ứng câu có công mài sắt có ngày nên kim, bền chí thì việc sẽ thành.", tho: ["Suối trong bà lão ngồi mài,", "Ngày qua tháng lại, chày dài thành kim.", "Cậu trò đứng ngẫm lặng im,", "Trở về đèn sách, cánh chim vượt ngàn."], y: "Việc đang làm cần thêm bền bỉ, mỗi ngày tiến một chút là đủ. Ai không bỏ dở giữa chừng thì sớm muộn sẽ gặt được thành quả xứng đáng." },
  { so: 58, hang: 3, chude: "thoi", tich: "Bồ Đề Đạt Ma chín năm diện bích", ke: "Bồ Đề Đạt Ma sang phương Đông chưa gặp người hiểu mình, bèn vào chùa Thiếu Lâm ngồi quay mặt vào vách suốt chín năm, đến khi gặp được Huệ Khả mới truyền pháp. Quẻ này thời chưa đến, nên lặng lẽ tu dưỡng chờ duyên lành.", tho: ["Chín năm ngồi lặng hang sâu,", "Vách non in bóng, mặc dầu tuyết bay.", "Một lòng chẳng đổi đêm ngày,", "Chờ người tri kỷ dắt tay vào thiền."], y: "Việc mong muốn còn phải đợi, thời và người hợp chưa đến. Trong lúc chờ hãy giữ lòng bền, trau dồi bản thân, đến khi duyên tới tự khắc thuận." },
  { so: 59, hang: 5, chude: "thanhdat", tich: "Thánh Gióng vươn vai cưỡi ngựa sắt", ke: "Cậu bé làng Phù Đổng ba năm không nói không cười, nghe sứ vua tìm người tài thì bỗng cất tiếng, vươn vai thành tráng sĩ, cưỡi ngựa sắt dẹp tan giặc Ân. Quẻ này sức tích lâu nay gặp thời bừng lên, việc lớn ắt thành.", tho: ["Ba năm chẳng nói chẳng cười,", "Nghe vua cầu tướng, vươn người đứng ngay.", "Roi tre ngựa sắt tung bay,", "Giặc tan, đồng ruộng cấy cày bình yên."], y: "Sức lực và tài năng tích lũy bấy lâu nay gặp đúng thời để bừng lên. Việc lớn cứ mạnh dạn đảm đương, có người đồng lòng giúp sức, ắt thành công rực rỡ." },
  { so: 60, hang: 2, chude: "nhan", tich: "Tô Đông Pha và thiền sư Phật Ấn", ke: "Tô Đông Pha làm thơ khoe lòng mình tám ngọn gió thổi không lay, thiền sư Phật Ấn chỉ phê hai chữ chê mà ông giận dữ qua sông hỏi tội. Quẻ này dặn giữ chữ nhẫn, một lời khích bác đủ làm hỏng việc nếu lòng còn nóng.", tho: ["Thuyền ai giận dữ qua sông,", "Đôi lời chê nhẹ, lửa hồng bốc cao.", "Tám phương gió thổi lao xao,", "Lòng chưa yên được, sóng nào cũng xô."], y: "Dạo này dễ bị lời nói của người khác làm nóng mặt, giận lên thì hỏng việc. Nghe điều trái tai hãy thở chậm lại, để qua một đêm rồi hãy trả lời." },
  { so: 61, hang: 4, chude: "tichduc", tich: "Bần nữ dâng ngọn đèn nhỏ", ke: "Cô gái nghèo xin cả ngày mới đủ tiền mua chút dầu, thắp ngọn đèn nhỏ dâng Phật, đến sáng đèn lớn của vua quan đều tắt mà đèn cô vẫn sáng. Quẻ này lòng thành dù nhỏ cũng bền, việc thiện âm thầm sẽ được đền đáp.", tho: ["Đèn con một đốm giữa đêm,", "Gió lay chẳng tắt, càng thêm ấm lòng.", "Lầu son đèn lụi, trời trong,", "Ngọn đèn nghèo vẫn sáng chong đến ngày."], y: "Lòng thành và việc tốt nhỏ bé mình làm âm thầm bấy lâu đang được đền đáp. Cứ giữ tấm lòng ấy, giúp người trong sức mình, phúc sẽ bền như ngọn đèn không tắt." },
  { so: 62, hang: 3, chude: "quynhan", tich: "Viên ngọc khâu trong vạt áo", ke: "Kinh Pháp Hoa kể người bạn giàu khâu viên ngọc quý vào vạt áo người say, người ấy tỉnh dậy lang bạt nghèo khó nhiều năm mà không biết mình mang báu vật. Quẻ này quý nhân đã giúp từ trước, chịu tìm lại sẽ thấy lối ra.", tho: ["Áo sờn lang bạt bao xa,", "Nào hay ngọc quý bạn già gửi trao.", "Một mai lần áo xem sao,", "Ngọc xưa còn đó, khác nào trăng lên."], y: "Điều mình cần thật ra đã có sẵn, hoặc đã có người giúp từ trước mà mình chưa nhận ra. Hãy nhìn lại những gì đang có và hỏi han người cũ, lối ra sẽ hiện dần." },
  { so: 63, hang: 4, chude: "quynhan", tich: "Tấm đánh rơi chiếc hài", ke: "Dì ghẻ trộn thóc với gạo để Tấm khỏi đi hội, nhờ Bụt sai chim sẻ xuống nhặt giúp, Tấm được đi hội, đánh rơi chiếc hài và nhờ đó gặp nhà vua. Quẻ này lúc khó có người giúp, việc tưởng lỡ lại thành duyên.", tho: ["Đàn chim nhặt thóc giúp nàng,", "Hội xuân áo mới, hài vàng rơi đâu.", "Voi vua dừng bước bên cầu,", "Ướm hài vừa vặn, từ lâu đợi người."], y: "Đang gặp chuyện thiệt thòi nhưng có người tốt âm thầm giúp đỡ. Cứ hiền lành, chăm chỉ, điều mình tưởng đã đánh rơi lại dẫn tới cơ hội tốt đẹp." },
  { so: 64, hang: 4, chude: "thanhdat", tich: "Mạc Đĩnh Chi làm phú Ngọc tỉnh liên", ke: "Mạc Đĩnh Chi đỗ đầu nhưng vua chê dung mạo nhỏ bé, chưa muốn lấy làm trạng nguyên, ông dâng bài phú Ngọc tỉnh liên ví mình như sen trong giếng ngọc. Quẻ này tài thật rồi sẽ được nhìn nhận, chớ ngại vẻ ngoài thua người.", tho: ["Sen trong giếng ngọc ngát hương,", "Bùn đâu vấy được, gió sương vẫn lành.", "Dáng tuy nhỏ, chí lại thanh,", "Một thiên phú đẹp rạng danh bảng vàng."], y: "Tài năng và công sức thật của mình sắp được người trên nhìn nhận. Đừng tự ti vì vẻ ngoài hay xuất thân, cứ đem hết sở trường ra, việc sẽ thành." },
  { so: 65, hang: 1, chude: "tinh", tich: "Mỵ Châu để lộ nỏ thần", ke: "Mỵ Châu tin lời ngọt của Trọng Thủy, đem nỏ thần của vua cha cho xem, để chàng lén tráo mất lẫy thần, cơ nghiệp Âu Lạc vì thế mà lâm nguy. Quẻ này dặn giữ đầu óc tỉnh táo, dù là người thân cũng chớ để lộ việc hệ trọng.", tho: ["Dọc đường lông ngỗng trắng bay,", "Lời ngon rót mật, ai hay lẫy thần.", "Việc riêng giữ kín mười phân,", "Thành kia còn vững, bước chân đường dài."], y: "Đang có người dùng lời ngọt để dò chuyện hệ trọng hay chuyện tiền bạc của mình. Việc riêng, giấy tờ, mật khẩu giữ cho kỹ, tin ai cũng chừa một khoảng thì cơ nghiệp vẫn vững." },
  { so: 66, hang: 3, chude: "tichduc", tich: "Vương Tường nằm băng tìm cá", ke: "Vương Tường bị mẹ kế khắt khe, mùa đông bà thèm cá tươi, chàng ra sông cởi áo nằm trên mặt băng, băng tan ra, hai con cá chép nhảy lên. Quẻ này lòng hiếu thảo và nhẫn nại sẽ làm mềm cả điều tưởng cứng như băng.", tho: ["Mùa đông sông đóng băng dày,", "Lấy thân sưởi giá, lòng này chẳng lui.", "Băng tan, cá nhảy lên vui,", "Hiếu thơm đã khiến ngọt bùi về tay."], y: "Việc nhà hay việc mình đang lo có phần khó, người quanh mình chưa dễ chiều. Cứ lấy lòng hiếu thảo, nhẫn nại mà đối đãi, đá cứng rồi cũng mềm, chuyện sẽ dần êm." },
  { so: 67, hang: 5, chude: "quynhan", tich: "Chử Đồng Tử gặp Tiên Dung", ke: "Chàng nghèo Chử Đồng Tử vùi mình trong bãi cát để tránh thuyền rồng, không ngờ công chúa Tiên Dung dừng lại đúng chỗ ấy, gặp nhau mà nên duyên trời định. Quẻ này cuộc gặp tình cờ mở ra vận lớn, nghèo khó sắp qua.", tho: ["Bãi sông cát mịn trải dài,", "Thuyền rồng ghé bến, nào ai hẹn hò.", "Gặp nhau trời đã sắp cho,", "Cơ hàn khép lại, hết lo, phúc về."], y: "Quẻ đại cát, sắp gặp quý nhân hoặc một mối duyên tốt đến rất tình cờ. Cứ sống thật thà, sẵn lòng đón nhận, vận nghèo khó sẽ qua, nhà cửa ấm êm." },
  { so: 68, hang: 3, chude: "nhan", tich: "Trần Quốc Toản bóp nát quả cam", ke: "Còn nhỏ tuổi nên không được dự bàn việc nước ở Bình Than, Trần Quốc Toản ấm ức đến bóp nát quả cam vua ban lúc nào không hay, rồi về lo luyện quân, giữ chí. Quẻ này dạy nén cơn giận, biến uất ức thành sức chuẩn bị.", tho: ["Bến xưa sóng vỗ Bình Than,", "Tuổi xanh chưa được ngồi bàn việc chung.", "Cam vàng bóp vỡ, giận bùng,", "Nén lòng về luyện, cờ tung gió ngàn."], y: "Có chuyện làm mình ấm ức, thấy bị xem nhẹ hay bị gạt ra ngoài. Đừng để cơn giận lấn át, hãy lặng lẽ rèn thêm sức mình, đến lúc thích hợp sẽ có chỗ đứng." },
  { so: 69, hang: 3, chude: "doanvien", tich: "Từ Thức từ cõi tiên về quê", ke: "Từ Thức sống cùng tiên nữ Giáng Hương nơi động tiên mà lòng vẫn nhớ quê, xin về thăm thì làng cũ đã đổi thay, không còn ai nhận ra. Quẻ này nhắc thương nhớ ai thì về thăm sớm, đừng để sum họp phải chờ quá lâu.", tho: ["Động tiên mây trắng lưng đèo,", "Nhớ quê xin xuống, lòng theo mái nhà.", "Làng xưa cảnh đã khác xa,", "Thương ai về sớm, chén trà ấm tay."], y: "Lòng đang nhớ nhà, nhớ người thân hay bạn cũ. Có dịp thì về thăm, gọi điện hỏi han, đừng mải lo việc xa mà để những người thương phải đợi lâu." },
  { so: 70, hang: 5, chude: "doimoi", tich: "Lý Công Uẩn dời đô ra Thăng Long", ke: "Thấy Hoa Lư chật hẹp, Lý Công Uẩn quyết dời đô về thành Đại La rộng rãi, thuyền vừa tới nơi thì thấy rồng vàng bay lên, bèn đặt tên là Thăng Long. Quẻ này đổi chỗ, đổi cách đúng lúc sẽ mở ra cơ nghiệp lâu bền.", tho: ["Đá vây chật hẹp Hoa Lư,", "Thuyền xuôi về chốn rộng như biển trời.", "Rồng vàng uốn lượn chơi vơi,", "Kinh thành mới dựng, đời đời vững an."], y: "Đây là lúc nên mạnh dạn đổi mới: dời chỗ làm ăn, đổi cách nghĩ hay mở hướng đi rộng hơn. Tính kỹ rồi quyết, chỗ mới sẽ là đất lành để lập nghiệp lâu dài." },
  { so: 71, hang: 5, chude: "thanhdat", tich: "Đức Phật thành đạo dưới cội Bồ Đề", ke: "Sau sáu năm tìm đạo gian nan, thái tử ngồi dưới cội Bồ Đề nguyện chưa ngộ thì chưa đứng dậy, đến lúc sao Mai vừa mọc thì hoát nhiên giác ngộ. Quẻ này công phu bền bỉ nay đơm quả ngọt, việc lớn sắp viên thành.", tho: ["Sáu năm gió bụi đường xa,", "Bồ Đề cội cũ, la đà sương mai.", "Đêm tàn, bóng tối nhạt phai,", "Tâm như trăng tỏ, hoa khai khắp vườn."], y: "Bao công sức bền bỉ nay đến lúc kết trái, việc lớn sắp thành. Giữ tâm sáng suốt và khiêm cung, thành quả không chỉ cho riêng mình mà còn lợi cho nhiều người." },
  { so: 72, hang: 3, chude: "thiphi", tich: "La Hầu La và chậu nước", ke: "Chú tiểu La Hầu La hay nói đùa sai sự thật, Đức Phật bảo bưng chậu nước rửa chân rồi đổ đi, úp xuống, dạy rằng lời không thật làm lòng người trống rỗng như chậu úp. Quẻ này dặn giữ lời cho ngay, bớt nói chuyện thị phi.", tho: ["Chậu đầy đổ xuống sân rêu,", "Lời ra như nước, ai kêu được về.", "Giữ lời như giữ câu thề,", "Lòng ngay, mặc tiếng khen chê nhẹ nhàng."], y: "Lời nói lúc này dễ bị truyền đi và thêm bớt, một câu đùa cũng có thể thành chuyện. Nói ít, nói thật, chưa chắc thì đừng hứa, thị phi sẽ không bám được mình." },
  { so: 73, hang: 3, chude: "doimoi", tich: "Lương Thế Vinh đổ nước lấy bưởi", ke: "Thuở nhỏ chơi đá bưởi, quả bưởi lăn xuống hố sâu, bạn bè thò tay không tới, cậu Lương Thế Vinh bảo đem nước đổ vào cho bưởi tự nổi lên. Quẻ này việc bế tắc nên thử cách nghĩ khác, đổi lối làm là ra.", tho: ["Hố sâu bưởi lặn mất tăm,", "Với tay chẳng tới, cúi nằm hụt hơi.", "Đem gàu đổ nước, bưởi bơi,", "Nghĩ xoay một chút, tức thời mở ra."], y: "Việc đang kẹt không phải do thiếu sức mà do đi mãi một lối. Thử đổi cách làm, hỏi thêm người khác, một ý nhỏ có khi gỡ được việc lớn." },
  { so: 74, hang: 2, chude: "hoa", tich: "Thái Thuận hái dâu nuôi mẹ", ke: "Gặp năm loạn lạc đói kém, Thái Thuận đi hái dâu, chia quả chín đen để phần mẹ, quả còn chua giữ lại cho mình, toán giặc nghe chuyện cảm động bèn tặng gạo thịt. Quẻ này lúc khó giữ lòng hiếu nghĩa, họa có thể hóa ra phúc.", tho: ["Rừng dâu chín đỏ chín đen,", "Ngọt dành phần mẹ, chua quen phần mình.", "Đường đi gặp lúc đao binh,", "Kẻ hung cảm động, nghĩa tình tặng trao."], y: "Đang gặp lúc thiếu thốn, đường đi có trở ngại hay gặp người khó chịu. Cứ giữ lòng tử tế và chu toàn với người thân, chính điều đó sẽ khiến cái rủi quay thành cái may." },
  { so: 75, hang: 4, chude: "cancu", tich: "Lục Tổ Huệ Năng giã gạo", ke: "Chàng tiều phu Huệ Năng đến Ngũ Tổ học đạo, bị sai xuống nhà sau giã gạo suốt tám tháng mà không một lời than, đến khi làm bài kệ được truyền y bát. Quẻ này lặng lẽ làm tròn việc nhỏ, ngày được trọng dụng không xa.", tho: ["Cối chày giã gạo nhà sau,", "Đá đeo thêm nặng, chân đau chẳng sờn.", "Nửa đêm bài kệ sáng hơn,", "Thầy trao y bát, đền ơn tháng ngày."], y: "Hiện tại có thể phải làm việc nhỏ, việc nặng, ít người để ý. Cứ chăm chỉ làm tròn và giữ lòng khiêm tốn, người có mắt sẽ nhận ra và giao cho việc lớn." },
  { so: 76, hang: 4, chude: "doanvien", tich: "Chu Thọ Xương bỏ quan tìm mẹ", ke: "Mẹ ruột phải rời nhà khi Chu Thọ Xương mới bảy tuổi, năm mươi năm sau ông từ quan, đi khắp nơi dò hỏi, cuối cùng gặp lại mẹ ở đất Đồng Châu. Quẻ này lòng thương nhớ sẽ được đền đáp, người xa sắp sum họp.", tho: ["Năm mươi năm cách quan san,", "Rời triều tìm mẹ, dặm ngàn chẳng nao.", "Một chiều gặp mẹ bên ao,", "Mắt cay mừng tủi, nghẹn ngào gọi tên."], y: "Người thân hay bạn cũ ở xa sắp có tin, chuyện cách trở lâu nay có cơ hội nối lại. Chủ động tìm hỏi, mở lời trước, cuộc sum họp sẽ đến sớm hơn mình nghĩ." },
  { so: 77, hang: 1, chude: "haotai", tich: "Thạch Sùng còn thiếu mẻ kho", ke: "Thạch Sùng giàu có đem cả gia sản ra đánh cuộc khoe của với người, chỉ vì không có nổi một cái mẻ kho tầm thường mà thua sạch. Quẻ này dặn chớ khoe của, chớ đánh cuộc hơn thua, giữ chặt hầu bao thì của mới còn.", tho: ["Lầu cao của chất đầy kho,", "Khoe giàu một phút, chẳng lo mẻ nồi.", "Đêm nghe chặc lưỡi bồi hồi,", "Giữ gìn từng chút mới ngồi được yên."], y: "Tiền bạc dễ hao vì sĩ diện, khoe khoang hay ham hơn thua với người. Chi tiêu khiêm tốn, không cá cược, không cho vay liều, giữ từ đồng nhỏ thì qua được lúc khó." },
  { so: 78, hang: 2, chude: "tinh", tich: "Đẽo cày giữa đường", ke: "Anh nông dân dốc vốn mua gỗ về đẽo cày ngay bên đường, ai qua góp ý gì cũng nghe theo, đẽo mãi đến khi khúc gỗ tốt chỉ còn mẩu vụn. Quẻ này dặn giữ chủ kiến, nghe nhiều lời quá dễ hỏng việc và hao của.", tho: ["Ven đường gỗ tốt một cây,", "Người qua kẻ lại, đó đây góp bàn.", "Nghe ai cũng đẽo, gỗ tan,", "Ý mình giữ vững mới an việc cày."], y: "Lúc này nhiều người xúi bẩy, mỗi người một ý, dễ khiến mình chạy theo mà hao tiền tốn sức. Nghe thì nghe, nhưng phải tự cân nhắc, việc của mình mình quyết." },
  { so: 79, hang: 5, chude: "tichduc", tich: "Lang Liêu dâng bánh chưng bánh giầy", ke: "Các lang đua tìm của ngon vật lạ, riêng Lang Liêu nghèo mà hiếu thảo, được thần mách lấy gạo nếp làm bánh chưng vuông, bánh giầy tròn dâng vua cha và được truyền ngôi. Quẻ này lòng thành giản dị thắng mọi phô trương.", tho: ["Nếp thơm gói lá dong xanh,", "Vuông tròn hai chiếc, lòng thành dâng cha.", "Của ngon vật lạ bày ra,", "Chẳng bằng hạt gạo quê nhà nuôi ta."], y: "Tấm lòng thành và sự giản dị của mình sẽ được người trên quý trọng hơn mọi thứ phô trương. Việc gì làm bằng cái tâm thật, nhất là việc báo hiếu, đều gặp phúc lớn." },
  { so: 80, hang: 4, chude: "doimoi", tich: "Thái tử Tất Đạt Đa xuất gia", ke: "Sống giữa cung vàng mà thấy cảnh già, bệnh và nỗi khổ của muôn người, thái tử Tất Đạt Đa lên ngựa vượt thành trong đêm đi tìm đường giải thoát. Quẻ này lối cũ dù êm cũng nên mạnh dạn rẽ sang hướng mới ý nghĩa hơn.", tho: ["Cung cao nệm gấm êm đềm,", "Trăng soi ngựa trắng qua thềm ra đi.", "Gác ngai vàng chẳng tiếc chi,", "Dặm dài mở lối từ bi cho đời."], y: "Đây là lúc nên dứt khoát với điều đã cũ, dù nó đang êm ấm, để theo con đường mình thấy đúng và có ích hơn. Tính kỹ, nói rõ với người nhà rồi hãy bước, đường mới sẽ rộng mở." },
  { so: 81, hang: 2, chude: "thantrong", tich: "Chú Cuội bay lên cung trăng", ke: "Cuội dặn vợ đừng tưới nước bẩn vào gốc cây đa thần, vợ lỡ quên, cây bật gốc bay lên trời, Cuội níu theo mà lên tận cung trăng ngồi mãi đến giờ. Quẻ này dặn việc gì cũng phải cẩn thận, lời dặn quan trọng chớ để quên.", tho: ["Cây đa đầu ngõ xanh rì,", "Ai ngờ phút chốc quên đi, cây lìa.", "Rễ bay lên giữa trời kia,", "Trăng cao ngồi đó, cách chia xóm làng."], y: "Dạo này dễ lơ đễnh, quên lời dặn hay sơ suất việc nhỏ mà thành chuyện lớn. Việc quan trọng nên ghi lại, kiểm tra lần nữa trước khi làm, nhắc người nhà cùng để ý." },
  { so: 82, hang: 4, chude: "thanhdat", tich: "Cóc kiện trời", ke: "Trời hạn lâu ngày, chú cóc rủ cua, gấu, cọp, ong, cáo lên cửa trời kiện, khéo bày trận nên thắng cả thiên binh, được Ngọc Hoàng cho mưa xuống. Quẻ này phận nhỏ mà chí lớn, biết hợp sức thì việc khó cũng thành.", tho: ["Nắng thiêu nứt nẻ ruộng xa,", "Cóc con dẫn bạn đi qua cổng trời.", "Đồng lòng, sấm sét cũng lơi,", "Mưa rào trút xuống, khắp nơi lúa vàng."], y: "Việc tưởng quá sức mình lại có thể thành nếu biết kết bạn, chia việc và kiên trì đòi lẽ phải. Việc cần đề đạt, cần xin hay làm việc chung lúc này đều thuận, cứ đường hoàng mà làm." },
  { so: 83, hang: 2, chude: "haotai", tich: "Người anh may túi mười hai gang", ke: "Chim thần dặn may túi ba gang đựng vàng, người em làm đúng nên đổi đời, còn người anh tham may túi to, nhét đầy quá sức chim chở, giữa biển vàng rơi sạch. Quẻ này lòng tham dễ làm hao của, biết đủ mới giữ được lộc.", tho: ["Khế chua chín ngọt đầu hè,", "Chim thần ăn khế, chở che nhà nghèo.", "Ba gang vừa đủ mang theo,", "Túi to tham nặng, vàng gieo xuống dòng."], y: "Tiền bạc lúc này dễ hao vì muốn nhiều hơn sức mình gánh nổi: vay to, ôm hàng quá tay, tin lời hứa lãi cao. Biết đủ, làm vừa sức, giữ phần chắc chắn thì của mới bền." },
  { so: 84, hang: 2, chude: "tichduc", tich: "Tích Chu đi tìm bà", ke: "Tích Chu mải chơi, bỏ mặc bà khát nước lúc ốm, bà hóa thành chim bay đi, cậu hối hận lặn lội tìm nước suối tiên mang về thì bà mới trở lại. Quẻ này dặn quay về lo cho người thân, sửa lỗi kịp thời thì phúc lại về.", tho: ["Chim bay xa tít mây ngàn,", "Gọi bà khản cổ theo làn gió may.", "Lội rừng múc suối tận tay,", "Bà về, cháu nguyện từ rày thảo ngoan."], y: "Có thể mình đã lơ là người thân hay quên một lời hứa, nay thấy lòng áy náy. Hãy sửa ngay bằng việc làm: về thăm, chăm sóc, nói lời xin lỗi, mọi chuyện sẽ ấm lại." },
  { so: 85, hang: 4, chude: "cancu", tich: "Nguyễn Hiền nghe giảng ngoài cửa lớp", ke: "Nhà nghèo bỏ học, Nguyễn Hiền vừa chăn trâu thả diều vừa đứng ngoài lớp nghe giảng, lấy nền cát làm giấy, ngón tay làm bút, mười ba tuổi đã đỗ trạng nguyên. Quẻ này chịu học, chịu khó thì thiếu thốn không cản được.", tho: ["Diều ai cao vút gió đồng,", "Nép ngoài cửa lớp, ngóng trông lời thầy.", "Cát vàng làm giấy, lá cây,", "Mười ba đỗ trạng, rồng mây gặp thời."], y: "Hoàn cảnh còn thiếu thốn nhưng chí học và sự chăm chỉ sẽ mở đường. Tận dụng mọi điều kiện nhỏ, chịu học hỏi bất cứ ai, đường công danh sẽ rộng mở." },
  { so: 86, hang: 4, chude: "doanvien", tich: "Gã cùng tử trở về nhà cha", ke: "Kinh Pháp Hoa kể người con bỏ nhà lang bạt nhiều năm, tình cờ về đến cổng nhà cha thì sợ hãi bỏ chạy, người cha kiên nhẫn cho làm từ việc nhỏ đến việc lớn mới nhận con. Quẻ này người thân đang chờ, cứ từng bước mà về.", tho: ["Bao năm lưu lạc phố phường,", "Về ngang cổng cũ, còn vương ngại ngùng.", "Cha già lặng lẽ bao dung,", "Từng ngày dìu dắt, vui chung một nhà."], y: "Chuyện gia đình hay mối quan hệ từng xa cách đang có cơ hội hàn gắn. Đừng ngại ngùng, cứ từng bước nối lại, người thân vẫn luôn rộng lòng chờ mình." },
  { so: 87, hang: 3, chude: "tinh", tich: "Anh Khoai và cây tre trăm đốt", ke: "Phú ông hứa gả con gái nếu anh Khoai làm lụng ba năm, rồi lật lọng bắt đi tìm cây tre trăm đốt, nhờ Bụt dạy câu khắc nhập khắc xuất mà anh trị được kẻ gian. Quẻ này lời hứa ngọt chưa chắc đã thật, cứ tỉnh táo mà làm.", tho: ["Phú ông hứa ngọt như đường,", "Mấy mùa cày cấy, nắng sương dãi dầu.", "Tre trăm đốt biết tìm đâu,", "Một câu khắc nhập, nhiệm mầu hiện ra."], y: "Có người hứa hẹn nghe rất hay nhưng chưa chắc giữ lời. Việc gì cũng nên nói rõ, ghi rõ từ đầu, đừng chỉ tin lời ngọt, gặp khó thì bình tĩnh tìm người hiểu chuyện giúp." },
  { so: 88, hang: 1, chude: "thantrong", tich: "Lâm Xung lỡ bước vào Bạch Hổ đường", ke: "Lâm Xung mới mua được thanh bảo đao, nghe người lạ mời mang đao vào phủ cho quan xem, cứ thế bước thẳng vào Bạch Hổ đường là nơi cấm, bị vu tội mà phải đi đày. Quẻ này dặn trước khi bước vào việc gì phải hỏi rõ, đọc kỹ.", tho: ["Bảo đao sáng loáng trong tay,", "Người mời ngọt giọng, chẳng hay mưu hèn.", "Sảnh sâu lối cấm tối đen,", "Hỏi cho tường tận, thật quen hãy vào."], y: "Đang có lời mời, lời rủ nghe rất thuận tai nhưng ẩn điều bất lợi. Việc gì chưa rõ thì chưa nhận, giấy tờ chưa đọc kỹ thì chưa ký, cẩn thận lúc này giữ được bình an lâu dài." },
  { so: 89, hang: 1, chude: "thiphi", tich: "Tống Giang đề thơ lầu Tầm Dương", ke: "Tống Giang say rượu trên lầu Tầm Dương, viết mấy câu thơ ngông lên vách, kẻ xấu chép lại đem tâu, thành cớ để bắt tội. Quẻ này dặn giữ miệng giữ lời, lúc vui hay buồn cũng chớ viết, chớ nói điều dễ bị bắt bẻ.", tho: ["Bên sông chén rượu đầy vơi,", "Men say vung bút, đất trời ngông nghênh.", "Mực khô, chuyện đã lênh đênh,", "Bớt lời, tránh được thác ghềnh mai sau."], y: "Lời nói, tin nhắn hay bài viết lúc này dễ bị chép lại, thêm thắt rồi quay ra hại mình. Lúc nóng giận hay vui quá đừng viết, đừng hứa, đừng bình phẩm ai, thị phi sẽ tự lắng." },

  { so: 92, hang: 5, chude: "doanvien", tich: "Bô lão hội nghị Diên Hồng", ke: "Giặc mạnh kéo đến, Thượng hoàng nhà Trần mời các bô lão khắp nơi về điện Diên Hồng hỏi kế, muôn người như một đồng thanh xin đánh, nhờ lòng dân hợp sức mà giữ được non sông. Quẻ này trên dưới một lòng, việc lớn ắt thành.", tho: ["Tóc sương bô lão về đây,", "Muôn nhà một tiếng, sum vầy chung tay.", "Gió to chẳng thể nào lay,", "Trên hòa dưới thuận, ngày ngày ấm êm."], y: "Trong nhà ngoài ngõ đồng lòng, việc chung bàn đâu xong đó. Cứ mời mọi người cùng góp ý, cùng chung tay, sức của số đông sẽ đưa việc lớn tới thành công." },

  { so: 94, hang: 2, chude: "hoa", tich: "Thạch Sanh gảy đàn trong ngục", ke: "Bị kẻ gian hãm hại vào ngục, Thạch Sanh chẳng oán than mà lấy đàn thần gảy, tiếng đàn vang đến cung vua, nỗi oan được giải, người ngay được rõ mặt. Quẻ này lúc bị vây khốn hãy giữ lòng ngay, họa sẽ chuyển thành phúc.", tho: ["Song tù gió lạnh căm căm,", "Đàn ai một khúc, xa xăm vọng lời.", "Tiếng tơ thấu đến tận trời,", "Oan tan, lòng sáng, cuộc đời sang trang."], y: "Đang gặp chuyện oan ức hoặc bị người khác lấn lướt, tưởng như bế tắc. Đừng nóng nảy, cứ làm tốt phần việc của mình, sự thật sẽ có cách lên tiếng và cái rủi này mở ra cái may." },
  { so: 95, hang: 3, chude: "nhan", tich: "Đức Phật cảm hóa voi say", ke: "Đề Bà Đạt Đa chuốc rượu cho voi dữ rồi thả ra đường Đức Phật đi qua, ai nấy bỏ chạy, riêng Ngài đứng yên tỏa lòng từ, voi say đến trước mặt quỳ xuống. Quẻ này gặp người nóng nảy, mình càng bình tĩnh thì việc càng êm.", tho: ["Voi say bụi đỏ mù đường,", "Người người chạy tán, bốn phương rối bời.", "Áo vàng đứng lặng thảnh thơi,", "Voi quỳ dưới gót, giận vơi hết rồi."], y: "Quanh mình đang có người nóng nảy hay chuyện dễ bùng lên tranh cãi. Mình giữ được bình tĩnh và lòng tử tế thì cơn giận của người cũng tự lắng, chuyện lớn hóa nhỏ." },
  { so: 96, hang: 2, chude: "haotai", tich: "Dương Chí mất của trên đồi Hoàng Nê", ke: "Dương Chí áp tải gánh quà mừng thọ, giữa trưa nắng gắt trên đồi Hoàng Nê, quân lính ham chút rượu mát của khách buôn lạ mặt mà mê man, của cải bị lấy sạch. Quẻ này dặn giữ của, chớ vì mệt mỏi hay ham rẻ mà lơ là.", tho: ["Đồi trưa nắng đổ chang chang,", "Mỏi chân dừng lại, rượu mang tới mời.", "Thuốc mê một chén rã rời,", "Tỉnh ra mới biết của rơi vào người."], y: "Tiền của dễ hao vì một phút lơ là: mệt mỏi, cả nể hay ham món hời của người lạ. Việc giữ tiền, giữ hàng phải tự tay làm, không vội tin lời mời chào, nhất là nơi đông người." },
  { so: 97, hang: 3, chude: "thoi", tich: "Nguyễn Trãi tiễn cha ở ải Nam Quan", ke: "Cha bị giặc giải sang phương Bắc, Nguyễn Trãi theo tiễn đến ải Nam Quan, cha khuyên con quay về lo việc lớn chứ đừng khóc theo vô ích. Quẻ này dặn nén buồn, lùi lại chuẩn bị, chờ đúng thời mới làm nên việc.", tho: ["Ải xa bạc trắng ngàn lau,", "Lời cha khuyên nhủ: mau mau quay về.", "Nén buồn, giữ chí, chẳng nề,", "Đợi khi gió thuận, bốn bề cờ bay."], y: "Đang có chuyện buồn hoặc việc lớn chưa làm được ngay. Đừng cố theo cảm xúc, hãy lùi lại một bước, giữ sức và chuẩn bị, đến khi thời thuận mới ra tay thì thành." },
  { so: 98, hang: 3, chude: "thantrong", tich: "Bạch Cư Dị đọc thơ cho bà lão", ke: "Mỗi khi làm xong bài thơ, Bạch Cư Dị đọc cho một bà lão nghe, chỗ nào bà chưa hiểu thì ông sửa lại cho đến khi bà gật đầu. Quẻ này dặn việc gì cũng xem đi xét lại, nói cho rõ, viết cho kỹ thì mới tránh sai sót.", tho: ["Hiên tranh bà cụ nghe thơ,", "Câu nào còn rối như tơ, sửa dần.", "Từng câu gọt giũa mấy lần,", "Chữ hiền dễ thấm, người gần người xa."], y: "Việc đang làm còn chỗ chưa rõ ràng, dễ sinh hiểu lầm hay sai sót. Đọc lại giấy tờ, hỏi lại cho chắc, nói sao cho người nghe dễ hiểu, cẩn thận hôm nay đỡ phiền mai sau." },
  { so: 99, hang: 2, chude: "doimoi", tich: "Ương Quật Ma La quay đầu", ke: "Ương Quật Ma La lầm đường theo thầy tà, đuổi theo Đức Phật mãi không kịp bèn quát dừng lại, Ngài đáp: “Ta đã dừng, ông chưa dừng”, ông bừng tỉnh buông dao quay đầu. Quẻ này dặn biết sai thì dừng, quay lại vẫn còn kịp.", tho: ["Rừng sâu lạc bước bao lâu,", "Chạy hoài chẳng kịp, quay đầu ngộ ra.", "Buông dao, lối cũ lìa xa,", "Bến kia vẫn đợi, thuyền qua kịp thời."], y: "Nếu đang đi sai hướng, làm điều mình biết là không nên, thì đây là lúc dừng lại. Quay đầu chưa bao giờ là muộn, sửa từ hôm nay thì đường lành vẫn mở." },
